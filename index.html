<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lexicon Hero - Pixel Adventure</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background: #121212; overflow: hidden; font-family: 'Press Start 2P', cursive; }
        #game-ui { position: absolute; top: 20px; left: 20px; color: white; z-index: 10; }
        .mission-box {
            position: absolute; top: 20px; right: 20px;
            background: rgba(0, 0, 0, 0.7); padding: 15px;
            border: 3px solid #00f2ff; color: #00f2ff; font-size: 10px;
        }
        canvas { display: block; box-shadow: inset 0 0 100px #000; }
    </style>
</head>
<body>

<div id="game-ui">
    <div>POINTS: <span id="score">0</span></div>
    <div id="lives-display" style="color: #ff0055; margin-top: 10px;">LIVES: ♥♥♥</div>
</div>

<div class="mission-box">
    MISSION: COLLECT WORDS
    <div id="target" style="color: #fff; margin-top: 10px; font-size: 14px;">NEXT: "UNIQUE"</div>
</div>

<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const GRAVITY = 0.6;
const JUMP = -14;
const SPEED = 6;

let score = 0;
let lives = 3;
let frameCount = 0;
const mission = ["UNIQUE", "DESTINATION", "SCHOLARSHIP", "ABROAD", "COLLEAGUE"];
let currentIdx = 0;

const keys = {};
window.onkeydown = e => keys[e.code] = true;
window.onkeyup = e => keys[e.code] = false;

const player = {
    x: 100, y: 500, w: 30, h: 50,
    vx: 0, vy: 0, grounded: false,
    facing: 1 // 1 for right, -1 for left
};

const platforms = [
    {x: 0, y: canvas.height - 50, w: canvas.width, h: 50}, // Ground
    {x: 200, y: canvas.height - 200, w: 150, h: 20},
    {x: 450, y: canvas.height - 350, w: 200, h: 20},
    {x: 100, y: canvas.height - 450, w: 150, h: 20},
    {x: 750, y: canvas.height - 250, w: 150, h: 20},
    {x: 1000, y: canvas.height - 400, w: 200, h: 20}
];

const words = mission.map((text, i) => ({
    text, x: 200 + Math.random()*(canvas.width-400), 
    y: 100 + Math.random()*(canvas.height-400),
    collected: false
}));

// --- KARAKTER ÇİZİM FONKSİYONU (İNSAN FİGÜRÜ) ---
function drawHuman(x, y, facing, isMoving, isJumping) {
    ctx.save();
    ctx.translate(x + 15, y + 25);
    ctx.scale(facing, 1);

    const anim = isMoving ? Math.sin(frameCount * 0.2) * 10 : 0;
    
    // Kafa
    ctx.fillStyle = "#FFDBAC"; // Ten rengi
    ctx.fillRect(-10, -25, 20, 20);
    
    // Saç/Şapka
    ctx.fillStyle = "#331E12";
    ctx.fillRect(-10, -25, 20, 5);

    // Gövde (T-Shirt)
    ctx.fillStyle = "#00f2ff";
    ctx.fillRect(-12, -5, 24, 20);

    // Bacaklar
    ctx.fillStyle = "#333";
    if (isJumping) {
        ctx.fillRect(-10, 15, 8, 10); // Sol bacak kırık
        ctx.fillRect(2, 10, 8, 10);   // Sağ bacak yukarıda
    } else {
        ctx.fillRect(-10, 15, 8, 10 + anim); // Sol bacak
        ctx.fillRect(2, 15, 8, 10 - anim);  // Sağ bacak
    }

    // Kollar
    ctx.fillStyle = "#FFDBAC";
    if (isMoving) {
        ctx.fillRect(8, -5, 6, 12 + anim);
    } else {
        ctx.fillRect(8, -5, 6, 15);
    }

    ctx.restore();
}

function update() {
    frameCount++;
    if (keys['ArrowRight'] || keys['KeyD']) {
        player.vx = SPEED;
        player.facing = 1;
    } else if (keys['ArrowLeft'] || keys['KeyA']) {
        player.vx = -SPEED;
        player.facing = -1;
    } else {
        player.vx *= 0.8;
    }

    if ((keys['Space'] || keys['KeyW'] || keys['ArrowUp']) && player.grounded) {
        player.vy = JUMP;
        player.grounded = false;
    }

    player.vy += GRAVITY;
    player.x += player.vx;
    player.y += player.vy;

    player.grounded = false;
    platforms.forEach(p => {
        if (player.x < p.x + p.w && player.x + player.w > p.x &&
            player.y < p.y + p.h && player.y + player.h > p.y) {
            if (player.vy > 0) {
                player.y = p.y - player.h;
                player.vy = 0;
                player.grounded = true;
            }
        }
    });

    words.forEach(w => {
        if (!w.collected && Math.abs(player.x - w.x) < 50 && Math.abs(player.y - w.y) < 50) {
            if (w.text === mission[currentIdx]) {
                w.collected = true;
                currentIdx++;
                score += 500;
                if(currentIdx < mission.length) {
                    document.getElementById('target').innerText = `NEXT: "${mission[currentIdx]}"`;
                } else {
                    alert("VICTORY! All words collected!");
                    location.reload();
                }
            } else {
                lives--;
                player.x = 100; player.y = 100;
                document.getElementById('lives-display').innerText = "LIVES: " + "♥".repeat(lives);
                if(lives <= 0) { alert("GAME OVER!"); location.reload(); }
            }
        }
    });

    if (player.y > canvas.height) { player.x = 100; player.y = 0; lives--; }
}

function draw() {
    ctx.fillStyle = "#1a1a2e";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Platformlar
    ctx.fillStyle = "#16213e";
    platforms.forEach(p => {
        ctx.fillRect(p.x, p.y, p.w, p.h);
        ctx.strokeStyle = "#4cc9f0";
        ctx.lineWidth = 3;
        ctx.strokeRect(p.x, p.y, p.w, p.h);
    });

    // Kelimeler
    words.forEach(w => {
        if (!w.collected) {
            ctx.fillStyle = (w.text === mission[currentIdx]) ? "#fff" : "#444";
            ctx.font = "12px 'Press Start 2P'";
            ctx.textAlign = "center";
            ctx.fillText(w.text, w.x, w.y);
            if (w.text === mission[currentIdx]) {
                ctx.strokeStyle = "rgba(255,255,255,0.2)";
                ctx.beginPath();
                ctx.arc(w.x, w.y-5, 40, 0, Math.PI*2);
                ctx.stroke();
            }
        }
    });

    // Karakter (İnsan)
    const isMoving = Math.abs(player.vx) > 0.5;
    drawHuman(player.x, player.y, player.facing, isMoving, !player.grounded);

    document.getElementById('score').innerText = score;
    requestAnimationFrame(draw);
}

gameLoop = () => { update(); draw(); requestAnimationFrame(gameLoop); };
draw(); // Start loop
update();
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
