<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAWS Cloud Security | Dashboard Access</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --brand: #ffffff; --bg: #0b0b0f; --acc: #16161a; --blue: #0071e3; --border: rgba(255,255,255,0.08); }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
        
        body { background: var(--bg); font-family: 'Inter', sans-serif; color: white; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }

        /* Arka Plan Modern Derinlik Efekti */
        .bg-glow { position: absolute; width: 600px; height: 600px; background: radial-gradient(circle, rgba(0,113,227,0.12) 0%, rgba(0,0,0,0) 70%); z-index: 1; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; }

        .container { 
            width: 100%; max-width: 420px; padding: 40px; 
            background: rgba(20, 20, 25, 0.7); backdrop-filter: blur(30px);
            border-radius: 28px; border: 1px solid var(--border);
            text-align: center; position: relative; z-index: 10;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .logo-area { margin-bottom: 35px; }
        .logo-area h1 { font-weight: 800; font-size: 28px; letter-spacing: -1.5px; margin-bottom: 4px; }
        .logo-area span { font-size: 10px; text-transform: uppercase; color: var(--blue); letter-spacing: 4px; font-weight: 700; }

        .input-group { text-align: left; margin-bottom: 22px; }
        .input-group label { display: block; font-size: 12px; color: #a1a1a6; margin-bottom: 8px; font-weight: 500; padding-left: 4px; }
        .input-group input { 
            width: 100%; padding: 14px 18px; background: rgba(255,255,255,0.04); 
            border: 1px solid var(--border); border-radius: 14px; color: white;
            font-size: 15px; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .input-group input:focus { border-color: var(--blue); background: rgba(255,255,255,0.08); outline: none; box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.15); }

        .btn-action { 
            width: 100%; padding: 18px; background: white; color: black; border: none;
            border-radius: 14px; font-weight: 600; font-size: 15px; cursor: pointer;
            transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1); margin-top: 10px;
        }
        .btn-action:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(255,255,255,0.1); }
        .btn-action:active { transform: translateY(0); }

        /* DOĞRULAMA MODALI */
        #verification-stage { display: none; flex-direction: column; align-items: center; justify-content: center; position: fixed; top:0; left:0; width:100%; height:100%; background: #000; z-index: 100; }
        
        .scanner-container { position: relative; width: 320px; height: 320px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.1); overflow: hidden; margin-bottom: 40px; background: #050505; }
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        
        .scan-line { position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: var(--blue); box-shadow: 0 0 25px var(--blue); z-index: 10; animation: scan 3s infinite ease-in-out; }
        @keyframes scan { 0%, 100% { top: 5%; } 50% { top: 95%; } }

        .code-shield { background: #16161a; padding: 12px 30px; border-radius: 16px; font-size: 48px; font-weight: 200; letter-spacing: 14px; margin-bottom: 20px; border: 1px solid var(--border); color: var(--blue); }
        .status-txt { font-size: 13px; color: #86868b; letter-spacing: 0.5px; }

        .flash-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 999; display: none; }
    </style>
</head>
<body>

<div class="bg-glow"></div>
<div class="flash-overlay" id="flash"></div>

<div class="container" id="login-card">
    <div class="logo-area">
        <h1>CAWS</h1>
        <span>Security Cloud</span>
    </div>
    <p style="font-size: 14px; color: #86868b; margin-bottom: 30px; line-height: 1.5;">Master hesabınızı senkronize ederek güven
