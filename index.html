<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cosmic Word Builder - 9th Grade English</title>
    <style>
        body { margin: 0; background: #050505; color: white; font-family: 'Orbitron', sans-serif; overflow: hidden; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        .stat { position: absolute; background: rgba(0,0,0,0.6); padding: 10px 20px; border: 1px solid #00f2ff; border-radius: 5px; }
        #score-div { top: 20px; left: 20px; color: #00f2ff; }
        #sentence-container { top: 20px; left: 50%; transform: translateX(-50%); width: 60%; text-align: center; }
        .word-slot { display: inline-block; margin: 5px; padding: 5px 15px; border-bottom: 3px solid #444; min-width: 80px; font-size: 20px; }
        .found { border-bottom-color: #00f2ff; color: #00f2ff; animation: glow 1s ease; }
        @keyframes glow { 0% { text-shadow: 0 0 20px #fff; } 100% { text-shadow: 0 0 5px #00f2ff; } }
    </style>
</head>
<body>

<div id="ui-layer">
    <div id="score-div" class="stat">SCORE: <span id="score">0</span></div>
    <div id="sentence-container" class="stat">
        <div id="hint">NEXT WORD: <b id="target-hint" style="color:#ffcc00">I</b></div>
        <div id="slots"></div>
    </div>
</div>
<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// --- OYUN AYARLARI ---
const sentence = ["I", "WANT", "TO", "STUDY", "ABROAD", "IN", "A", "UNIQUE", "CITY"];
const distractors = ["THE", "CAT", "RUNS", "DOG", "COLLEAGUE", "AMBITIOUS", "GENEROUS", "ENVIRONMENT"];
let currentStep = 0;
let score = 0;
const particles = [];
const bullets = [];
const enemies = [];
const fallingWords = [];
const stars = Array(150).fill().map(() => ({x: Math.random()*canvas.width, y: Math.random()*canvas.height, s: Math.random()*2}));

// --- SES MOTORU (Web Audio API) ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(freq, type, duration) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
}

// --- BAŞLANGIÇ ---
const slotsDiv = document.getElementById('slots');
sentence.forEach(() => {
    let s = document.createElement('span');
    s.className = 'word-slot';
    s.innerText = '_____';
    slotsDiv.appendChild(s);
});

// --- OYUN NESNELERİ ---
const player = { x: canvas.width/2, y: canvas.height - 100, w: 40, h: 40 };

function createParticle(x, y, color) {
    for(let i=0; i<10; i++) {
        particles.push({x, y, vx: (Math.random()-0.5)*10, vy: (Math.random()-0.5)*10, life: 1, color});
    }
}

function spawnEnemy() {
    const isTarget = Math.random() > 0.6;
    const word = isTarget ? sentence[currentStep] : distractors[Math.floor(Math.random()*distractors.length)];
    enemies.push({
        x: Math.random() * (canvas.width-100) + 50,
        y: -50,
        word: word,
        isTarget: word === sentence[currentStep],
        speed: 2 + (score/1000)
    });
}

// --- ANA DÖNGÜ ---
function loop() {
    ctx.fillStyle = '#050505';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Arka Plan Yıldızlar
    ctx.fillStyle = 'white';
    stars.forEach(s => {
        s.y += s.s;
        if(s.y > canvas.height) s.y = 0;
        ctx.fillRect(s.x, s.y, 1, 1);
    });

    // Oyuncu (Uzay Gemisi)
    ctx.fillStyle = '#00f2ff';
    ctx.beginPath();
    ctx.moveTo(player.x, player.y + player.h);
    ctx.lineTo(player.x + player.w/2, player.y);
    ctx.lineTo(player.x + player.w, player.y + player.h);
    ctx.fill();

    // Mermiler
    bullets.forEach((b, i) => {
        b.y -= 10;
        ctx.fillStyle = '#ff0055';
        ctx.fillRect(b.x - 2, b.y, 4, 15);
        if(b.y < 0) bullets.splice(i, 1);
    });

    // Düşmanlar (Balon/Kelimeler)
    enemies.forEach((en, i) => {
        en.y += en.speed;
        ctx.strokeStyle = '#00f2ff';
        ctx.lineWidth = 2;
        ctx.strokeRect(en.x - 40, en.y - 20, 80, 40);
        ctx.fillStyle = 'white';
        ctx.textAlign = 'center';
        ctx.fillText(en.word, en.x, en.y + 7);

        // Vurulma Kontrolü
        bullets.forEach((b, bi) => {
            if(b.x > en.x-40 && b.x < en.x+40 && b.y > en.y-20 && b.y < en.y+20) {
                createParticle(en.x, en.y, '#00f2ff');
                playSound(400, 'square', 0.1);
                if(en.word === sentence[currentStep]) {
                    fallingWords.push({x: en.x, y: en.y, text: en.word});
                }
                enemies.splice(i, 1);
                bullets.splice(bi, 1);
            }
        });
    });

    // Düşen Kelimeleri Toplama
    fallingWords.forEach((fw, i) => {
        fw.y += 3;
        ctx.fillStyle = '#ffcc00';
        ctx.font = 'bold 24px Arial';
        ctx.fillText(fw.text, fw.x, fw.y);

        if(Math.abs(fw.x - (player.x + 20)) < 40 && Math.abs(fw.y - player.y) < 40) {
            playSound(800, 'sine', 0.2);
            slotsDiv.children[currentStep].innerText = fw.text;
            slotsDiv.children[currentStep].classList.add('found');
            currentStep++;
            score += 100;
            document.getElementById('score').innerText = score;
            fallingWords.splice(i, 1);
            
            if(currentStep >= sentence.length) {
                alert("MISSION COMPLETE! 9th Grade English Mastered!");
                location.reload();
            } else {
                document.getElementById('target-hint').innerText = sentence[currentStep];
            }
        }
    });

    // Parçacıklar
    particles.forEach((p, i) => {
        p.x += p.vx; p.y += p.vy; p.life -= 0.02;
        ctx.fillStyle = `rgba(0, 242, 255, ${p.life})`;
        ctx.fillRect(p.x, p.y, 3, 3);
        if(p.life <= 0) particles.splice(i, 1);
    });

    requestAnimationFrame(loop);
}

// Kontroller
window.onmousemove = (e) => player.x = e.clientX - 20;
window.onclick = () => {
    bullets.push({x: player.x + 20, y: player.y});
    playSound(150, 'sawtooth', 0.05);
};

setInterval(spawnEnemy, 1200);
loop();
</script>
</body>
</html>
