<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>The Scholar's Journey - English Quest</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background: #1a2a1a; overflow: hidden; font-family: 'Poppins', sans-serif; }
        canvas { display: block; filter: saturate(1.2) contrast(1.1); }
        
        #ui { position: absolute; inset: 0; pointer-events: none; z-index: 100; padding: 25px; }
        .sentence-display { text-align: center; font-family: 'Cinzel'; font-size: 32px; color: #fff; text-shadow: 0 4px 10px rgba(0,0,0,0.5); background: rgba(0,0,0,0.3); padding: 10px; border-radius: 15px; width: fit-content; margin: 0 auto; }
        .stats { display: flex; justify-content: space-between; margin-top: 15px; }
        #hp-display { color: #ff3e3e; font-size: 28px; text-shadow: 0 0 10px #ff3e3e; }

        #start-menu {
            position: absolute; inset: 0; background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1441974231531-c6227db76b6e?ixlib=rb-1.2.1&auto=format&fit=crop&w=1351&q=80');
            background-size: cover; z-index: 200; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .btn { padding: 15px 50px; border: 3px solid #fff; background: none; color: white; cursor: pointer; font-size: 22px; font-family: 'Cinzel'; transition: 0.3s; }
        .btn:hover { background: #fff; color: #1a2a1a; transform: scale(1.1); box-shadow: 0 0 30px #fff; }
    </style>
</head>
<body>

<div id="start-menu">
    <h1 style="color:white; font-family:'Cinzel'; font-size: 55px; margin-bottom: 20px;">SCHOLAR'S JOURNEY</h1>
    <p style="color:#ddd; margin-bottom:30px;">Collect the words, finish the sentence.</p>
    <button class="btn" onclick="startGame()">START ADVENTURE</button>
</div>

<div id="ui">
    <div class="sentence-display" id="sentence-text">_ _ _ _ _</div>
    <div class="stats">
        <div id="hp-display">♥♥♥</div>
        <div style="color:#6affbe; font-weight:bold;">SHIFT: KNOWLEDGE DASH</div>
    </div>
</div>

<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const GAME = {
    active: false, frame: 0, level: 0, hp: 3, shake: 0,
    words: ["I", "WANT", "TO", "LEARN", "ENGLISH"]
};

const keys = {};
window.onkeydown = e => keys[e.code] = true;
window.onkeyup = e => keys[e.code] = false;

// --- DÜNYA VE KARAKTER ---
const player = {
    x: 150, y: 300, vx: 0, vy: 0, w: 40, h: 65,
    facing: 1, grounded: false, dashing: false, dashCooldown: 0,
    update(lvl) {
        // Dash Sistemi
        if(keys['ShiftLeft'] && this.dashCooldown <= 0) {
            this.dashing = true; this.dashCooldown = 60;
            GAME.shake = 10;
            spawnParticles(this.x, this.y, "#fff", 15); // Sayfa efekti
            setTimeout(() => this.dashing = false, 180);
        }

        if(this.dashing) {
            this.vx = 20 * this.facing; this.vy = 0;
        } else {
            if(keys['KeyD'] || keys['ArrowRight']) { this.vx += 0.8; this.facing = 1; }
            else if(keys['KeyA'] || keys['ArrowLeft']) { this.vx -= 0.8; this.facing = -1; }
            else this.vx *= 0.82;

            if(Math.abs(this.vx) > 7) this.vx = 7 * Math.sign(this.vx);
            if((keys['Space'] || keys['KeyW']) && this.grounded) { this.vy = -16; this.grounded = false; }
            this.vy += 0.8;
        }

        this.x += this.vx; this.y += this.vy;
        if(this.dashCooldown > 0) this.dashCooldown--;

        // BUG FIX: Aşağı düşme kontrolü
        if(this.y > canvas.height + 100) {
            takeDamage();
            return;
        }

        // Platform Çarpışma
        this.grounded = false;
        lvl.platforms.forEach(p => {
            if(this.x < p.x + p.w && this.x + this.w > p.x && this.y + this.h > p.y && this.y + this.h < p.y + 20 && this.vy >= 0) {
                this.y = p.y - this.h; this.vy = 0; this.grounded = true;
            }
        });
    }
};

// --- DOĞA TEMALI MAP TASARIMI ---
const map = {
    platforms: [
        {x: 0, y: 650, w: 900, h: 300, color: '#2d4c2d'}, // Başlangıç toprağı
        {x: 1050, y: 500, w: 300, h: 40, color: '#4a7c4a'}, // Havada asılı ada
        {x: 1450, y: 350, w: 250, h: 40, color: '#4a7c4a'},
        {x: 1800, y: 550, w: 1000, h: 400, color: '#2d4c2d'},
        {x: 3000, y: 400, w: 400, h: 40, color: '#4a7c4a'},
        {x: 3600, y: 600, w: 1200, h: 300, color: '#2d4c2d'}
    ],
    goal: {x: 4500, y: 550, text: "I"}
};

const particles = [];
const cam = { x: 0 };

function spawnParticles(x, y, color, count) {
    for(let i=0; i<count; i++) {
        particles.push({
            x: x, y: y, 
            vx: (Math.random()-0.5)*10, vy: (Math.random()-0.5)*10,
            life: 30, text: ["A","B","C","?","!"][Math.floor(Math.random()*5)]
        });
    }
}

function takeDamage() {
    GAME.hp--; GAME.shake = 20;
    if(GAME.hp <= 0) { alert("DERS BİTTİ! TEKRAR DENE."); location.reload(); }
    player.x = 150; player.y = 300; player.vx = 0;
    updateUI();
}

function updateUI() {
    let t = GAME.words.map((w, i) => i < GAME.level ? w : "_").join("  ");
    document.getElementById('sentence-text').innerText = t;
    document.getElementById('hp-display').innerText = "♥".repeat(GAME.hp);
}

function startGame() {
    document.getElementById('start-menu').style.display = 'none';
    GAME.active = true;
    updateUI();
    requestAnimationFrame(loop);
}

function loop() {
    if(!GAME.active) return;
    GAME.frame++;
    if(GAME.shake > 0) GAME.shake *= 0.9;

    player.update(map);
    cam.x += (player.x - canvas.width/3 - cam.x) * 0.1;
    if(cam.x < 0) cam.x = 0;

    // Hedef Kelimeye Ulaşma
    if(Math.hypot(player.x - map.goal.x, player.y - map.goal.y) < 70) {
        GAME.level++;
        if(GAME.level >= GAME.words.length) { alert("TEBRİKLER! TÜM CÜMLELER TAMAMLANDI."); location.reload(); }
        player.x = 150; player.y = 300; cam.x = 0;
        updateUI();
    }

    // DRAW
    // Gökyüzü (Sky Gradient)
    let skyGrd = ctx.createLinearGradient(0, 0, 0, canvas.height);
    skyGrd.addColorStop(0, "#4facfe"); skyGrd.addColorStop(1, "#00f2fe");
    ctx.fillStyle = skyGrd;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    if(GAME.shake > 1) ctx.translate((Math.random()-0.5)*GAME.shake, (Math.random()-0.5)*GAME.shake);
    
    // Parallax Bulutlar
    ctx.fillStyle = "rgba(255,255,255,0.5)";
    for(let i=0; i<10; i++) ctx.beginPath(), ctx.arc((i*1000)-cam.x*0.3, 200, 50, 0, 7), ctx.fill();

    ctx.translate(-cam.x, 0);

    // Platformları Çiz (Doğa Görünümü)
    map.platforms.forEach(p => {
        // Toprak kısmı
        ctx.fillStyle = "#3e2723"; 
        ctx.fillRect(p.x, p.y + 10, p.w, p.h);
        // Çimen üst tabaka
        ctx.fillStyle = "#4caf50";
        ctx.fillRect(p.x, p.y, p.w, 15);
        // Çimen parlaması
        ctx.fillStyle = "#8bc34a";
        ctx.fillRect(p.x, p.y, p.w, 4);
    });

    // Kelime / Kitap (Hedef)
    ctx.fillStyle = "#fff"; ctx.font = "bold 35px Cinzel"; ctx.textAlign = "center";
    ctx.fillText(map.goal.text, map.goal.x, map.goal.y + Math.sin(GAME.frame*0.1)*15);

    // Karakter Çizimi (Senin attığın sprite tarzında)
    drawScholar();

    // Harf Parçacıkları (Knowledge Dust)
    particles.forEach((p, i) => {
        p.x += p.vx; p.y += p.vy; p.life--;
        ctx.fillStyle = `rgba(255,255,255, ${p.life/30})`;
        ctx.font = "15px Arial";
        ctx.fillText(p.text, p.x, p.y);
        if(p.life <= 0) particles.splice(i, 1);
    });

    ctx.restore();
    requestAnimationFrame(loop);
}

function drawScholar() {
    ctx.save();
    ctx.translate(player.x + 20, player.y + 30);
    ctx.scale(player.facing, 1);

    // Dash sırasında hayalet iz
    if(player.dashing) {
        ctx.fillStyle = "rgba(255,255,255,0.3)";
        ctx.fillRect(-25, -30, 40, 60);
    }

    // Gövde (Ceket/Kıyafet)
    ctx.fillStyle = "#2d4c2d";
    ctx.fillRect(-15, -10, 30, 35);

    // Kafa ve Saç (Senin attığın karakterin kahverengi saçları gibi)
    ctx.fillStyle = "#5d4037"; // Saç
    ctx.beginPath(); ctx.roundRect(-18, -35, 36, 25, 10); ctx.fill();
    ctx.fillStyle = "#ffe0b2"; // Yüz
    ctx.beginPath(); ctx.arc(0, -20, 12, 0, Math.PI*2); ctx.fill();

    // Elinde Kitap (Yeşil kitap)
    ctx.fillStyle = "#1b5e20";
    ctx.fillRect(5, -5, 15, 20);
    ctx.fillStyle = "#fff"; // Kitap sayfaları
    ctx.fillRect(18, -5, 2, 20);

    ctx.restore();
}
</script>
</body>
</html>
