<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Scholar's Academy - The English Quest</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background: #050508; overflow: hidden; font-family: 'Poppins', sans-serif; }
        canvas { display: block; filter: saturate(1.1) contrast(1.1); }
        
        #ui { position: absolute; inset: 0; pointer-events: none; z-index: 100; padding: 30px; }
        .sentence-display { text-align: center; font-family: 'Cinzel'; font-size: 30px; color: #fff; text-shadow: 0 4px 15px rgba(0,242,255,0.5); background: rgba(0,0,0,0.5); padding: 15px; border-radius: 20px; width: fit-content; margin: 0 auto; border: 1px solid rgba(0,242,255,0.3); }
        .stats { display: flex; justify-content: space-between; margin-top: 20px; color: white; }
        #hp-display { color: #ff3e3e; font-size: 30px; text-shadow: 0 0 15px #ff3e3e; }

        #start-menu {
            position: absolute; inset: 0; background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), url('https://images.unsplash.com/photo-1541339907198-e08756defe43?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80');
            background-size: cover; z-index: 200; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .btn { padding: 18px 60px; border: 3px solid #00f2ff; background: none; color: #00f2ff; cursor: pointer; font-size: 24px; font-family: 'Cinzel'; transition: 0.3s; letter-spacing: 2px; }
        .btn:hover { background: #00f2ff; color: #050508; transform: scale(1.1); box-shadow: 0 0 40px #00f2ff; }
    </style>
</head>
<body>

<div id="start-menu">
    <h1 style="color:white; font-family:'Cinzel'; font-size: 60px; margin-bottom: 20px; text-shadow: 0 0 20px #00f2ff;">THE SCHOLAR'S ACADEMY</h1>
    <p style="color:#ddd; margin-bottom:40px; font-size: 18px;">Collect the words. Complete the sentence. Find the truth.</p>
    <button class="btn" onclick="startGame()">ENTER THE ACADEMY</button>
</div>

<div id="ui" style="display:none;">
    <div class="sentence-display" id="sentence-text">_ _ _ _ _</div>
    <div class="stats">
        <div id="hp-display">♥♥♥</div>
        <div style="color:#6affbe; font-weight:bold; letter-spacing: 1px;">SHIFT: KNOWLEDGE DASH</div>
    </div>
</div>

<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const GAME = {
    active: false, frame: 0, level: 0, hp: 3, shake: 0,
    words: ["I", "WANT", "TO", "LEARN", "ENGLISH"]
};

const keys = {};
window.onkeydown = e => keys[e.code] = true;
window.onkeyup = e => keys[e.code] = false;

const player = {
    x: 150, y: 300, vx: 0, vy: 0, w: 40, h: 65,
    facing: 1, grounded: false, dashing: false, dashCooldown: 0,
    update(lvl) {
        if(keys['ShiftLeft'] && this.dashCooldown <= 0) {
            this.dashing = true; this.dashCooldown = 60;
            GAME.shake = 12;
            spawnParticles(this.x, this.y, "#fff", 15); // Sayfa efekti
            setTimeout(() => this.dashing = false, 200);
        }

        if(this.dashing) {
            this.vx = 22 * this.facing; this.vy = 0;
        } else {
            if(keys['KeyD'] || keys['ArrowRight']) { this.vx += 0.9; this.facing = 1; }
            else if(keys['KeyA'] || keys['ArrowLeft']) { this.vx -= 0.9; this.facing = -1; }
            else this.vx *= 0.82;

            if(Math.abs(this.vx) > 7) this.vx = 7 * Math.sign(this.vx);
            if((keys['Space'] || keys['KeyW']) && this.grounded) { this.vy = -17; this.grounded = false; }
            this.vy += 0.85;
        }

        this.x += this.vx; this.y += this.vy;
        if(this.dashCooldown > 0) this.dashCooldown--;

        if(this.y > canvas.height + 150) { takeDamage(); return; }

        this.grounded = false;
        lvl.platforms.forEach(p => {
            if(this.x < p.x + p.w && this.x + this.w > p.x && this.y + this.h > p.y && this.y + this.h < p.y + 20 && this.vy >= 0) {
                this.y = p.y - this.h; this.vy = 0; this.grounded = true;
            }
        });
    }
};

// --- OKUL TEMALI HARİTA ---
const map = {
    platforms: [
        {x: 0, y: 650, w: 1000, h: 300, type: 'ground'}, // Başlangıç mermer zemin
        {x: 1200, y: 500, w: 350, h: 40, type: 'shelf'},  // Ahşap kitap rafı
        {x: 1700, y: 350, w: 250, h: 40, type: 'shelf'},
        {x: 2100, y: 550, w: 1200, h: 400, type: 'ground'},
        {x: 3400, y: 400, w: 300, h: 40, type: 'shelf'},
        {x: 4000, y: 600, w: 1500, h: 300, type: 'ground'}
    ],
    goal: {x: 4800, y: 550, text: "I"}
};

const particles = [];
const cam = { x: 0 };

function spawnParticles(x, y, color, count) {
    for(let i=0; i<count; i++) {
        particles.push({
            x: x, y: y, 
            vx: (Math.random()-0.5)*12, vy: (Math.random()-0.5)*12,
            life: 35, text: ["A","B","C","?","!"][Math.floor(Math.random()*5)]
        });
    }
}

function takeDamage() {
    GAME.hp--; GAME.shake = 25;
    if(GAME.hp <= 0) { alert("DERS BİTTİ! TEKRAR DENE."); location.reload(); }
    player.x = 150; player.y = 300; player.vx = 0;
    updateUI();
}

function updateUI() {
    let t = GAME.words.map((w, i) => i < GAME.level ? w : "_").join("  ");
    document.getElementById('sentence-text').innerText = t;
    document.getElementById('hp-display').innerText = "♥".repeat(GAME.hp);
}

function startGame() {
    document.getElementById('start-menu').style.display = 'none';
    document.getElementById('ui').style.display = 'block';
    GAME.active = true;
    updateUI();
    requestAnimationFrame(loop);
}

function loop() {
    if(!GAME.active) return;
    GAME.frame++;
    if(GAME.shake > 0) GAME.shake *= 0.9;

    player.update(map);
    cam.x += (player.x - canvas.width/2.5 - cam.x) * 0.1;
    if(cam.x < 0) cam.x = 0;

    if(Math.hypot(player.x - map.goal.x, player.y - map.goal.y) < 70) {
        GAME.level++;
        if(GAME.level >= GAME.words.length) { alert("TEBRİKLER! AKADEMİDEN MEZUN OLDUN."); location.reload(); }
        player.x = 150; player.y = 300; cam.x = 0;
        updateUI();
    }

    // DRAW
    // Gökyüzü (Akademik Gradient)
    let skyGrd = ctx.createLinearGradient(0, 0, 0, canvas.height);
    skyGrd.addColorStop(0, "#0a0a1a"); skyGrd.addColorStop(1, "#1a2a4a");
    ctx.fillStyle = skyGrd;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    if(GAME.shake > 1) ctx.translate((Math.random()-0.5)*GAME.shake, (Math.random()-0.5)*GAME.shake);
    
    // Parallax Bulutlar & Harfler
    ctx.fillStyle = "rgba(255,255,255,0.05)";
    for(let i=0; i<8; i++) {
        ctx.font = "20px Arial";
        ctx.fillText(["A","B","C","?"][Math.floor(Math.random()*4)], (i*900)-cam.x*0.4, 200 + Math.sin(GAME.frame*0.01+i)*50);
    }

    // ARKA PLAN OKUL BİNALARI (PARALLAX)
    ctx.fillStyle = "rgba(20, 30, 60, 0.4)";
    for(let i=0; i<5; i++) {
        // Bina silüeti
        ctx.fillRect((i*1500) - cam.x*0.2, 100, 600, 800);
        // Pencereler
        ctx.fillStyle = "rgba(255,255,255,0.1)";
        for(let py=150; py<800; py+=50) {
            for(let px=(i*1500)-cam.x*0.2+50; px<(i*1500)-cam.x*0.2+550; px+=50) {
                ctx.fillRect(px, py, 15, 25);
            }
        }
        ctx.fillStyle = "rgba(20, 30, 60, 0.4)"; // Reset bina rengi
    }

    ctx.translate(-cam.x, 0);

    // Platformlar (Okul Temalı)
    map.platforms.forEach(p => {
        if(p.type === 'ground') {
            // Mermer Zemin
            ctx.fillStyle = "#eee"; ctx.fillRect(p.x, p.y+10, p.w, p.h);
            ctx.fillStyle = "#fff"; ctx.fillRect(p.x, p.y, p.w, 15);
            // Mermer dokusu
            ctx.strokeStyle = "rgba(0,0,0,0.1)"; ctx.strokeRect(p.x, p.y, p.w, p.h);
        } else if(p.type === 'shelf') {
            // Kitap Rafı
            ctx.fillStyle = "#3e2723"; ctx.fillRect(p.x, p.y+5, p.w, p.h);
            ctx.fillStyle = "#5d4037"; ctx.fillRect(p.x, p.y, p.w, 8);
            // Kitap sırtları (Renk renk)
            for(let i=10; i<p.w-10; i+=15) {
                ctx.fillStyle = `hsl(${Math.random()*360}, 50%, 50%)`;
                ctx.fillRect(p.x+i, p.y+13, 10, 25);
            }
        }
    });

    // Hedef Kelime
    ctx.fillStyle = "#fff"; ctx.font = "bold 35px Cinzel"; ctx.textAlign = "center"; ctx.shadowBlur = 15; ctx.shadowColor = "#fff";
    ctx.fillText(map.goal.text, map.goal.x, map.goal.y + Math.sin(GAME.frame*0.1)*15);
    ctx.shadowBlur = 0;

    // Karakter Çizimi (The Scholar)
    drawScholar();

    // Harf Parçacıkları (Knowledge Dust)
    particles.forEach((p, i) => {
        p.x += p.vx; p.y += p.vy; p.life--;
        ctx.fillStyle = `rgba(0, 242, 255, ${p.life/35})`;
        ctx.font = "16px Arial";
        ctx.fillText(p.text, p.x, p.y);
        if(p.life <= 0) particles.splice(i, 1);
    });

    ctx.restore();
    requestAnimationFrame(loop);
}

function drawScholar() {
    ctx.save();
    ctx.translate(player.x + 20, player.y + 30);
    ctx.scale(player.facing, 1);

    // Dash sırasında hayalet iz
    if(player.dashing) {
        ctx.fillStyle = "rgba(0, 242, 255, 0.4)";
        ctx.fillRect(-25, -30, 40, 60);
    }

    // Gövde (Ceket/Kıyafet)
    ctx.fillStyle = "#2d4c2d";
    ctx.fillRect(-15, -10, 30, 35);

    // Kafa ve Saç (Senin attığın karakterin kahverengi saçları gibi)
    ctx.fillStyle = "#5d4037"; // Saç
    ctx.beginPath(); ctx.roundRect(-18, -35, 36, 25, 10); ctx.fill();
    ctx.fillStyle = "#ffe0b2"; // Yüz
    ctx.beginPath(); ctx.arc(0, -20, 12, 0, Math.PI*2); ctx.fill();

    // Elinde Kitap (Yeşil kitap)
    ctx.fillStyle = "#1b5e20";
    ctx.fillRect(5, -5, 15, 20);
    ctx.fillStyle = "#fff"; // Kitap sayfaları
    ctx.fillRect(18, -5, 2, 20);

    ctx.restore();
}
</script>
</body>
</html>
