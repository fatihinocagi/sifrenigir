<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hollow Lexicon - Alpha Build</title>
    <style>
        body { margin: 0; background: #08080a; overflow: hidden; font-family: 'Courier New', monospace; }
        canvas { display: block; }
        #ui {
            position: absolute; top: 20px; left: 20px; color: #fff;
            text-shadow: 0 0 5px #00f2ff; pointer-events: none;
        }
    </style>
</head>
<body>

<div id="ui">
    <div>FOCUS: <span id="word-target" style="color:#ff0055">NONE</span></div>
    <div style="font-size: 10px; margin-top:5px;">Controls: A-D (Move), W (Jump - Hold for higher), SHIFT (Dash)</div>
</div>

<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// --- HOLLOW KNIGHT FİZİK AYARLARI ---
const CONFIG = {
    gravity: 0.8,
    accel: 1.5,          // Hızlanma (Akıcılık için)
    friction: 0.85,      // Sürtünme (Yağ gibi kayma hissi)
    maxSpeed: 8,
    jumpForce: -16,
    minJumpForce: -6,    // Kısa basınca zıplama yüksekliği
    dashSpeed: 20,
    dashDuration: 10     // Kaç frame dash yapacak
};

let frameCount = 0;
const keys = {};
window.onkeydown = e => keys[e.code] = true;
window.onkeyup = e => keys[e.code] = false;

// --- NESNELER ---
const player = {
    x: 100, y: 300, w: 25, h: 45,
    vx: 0, vy: 0,
    grounded: false,
    facing: 1,
    isDashing: false,
    dashTimer: 0,
    canDash: true
};

const platforms = [
    {x: 0, y: canvas.height - 30, w: canvas.width, h: 30}, // Ground
    {x: 200, y: canvas.height - 150, w: 200, h: 15},
    {x: 500, y: canvas.height - 280, w: 150, h: 15},
    {x: 800, y: canvas.height - 200, w: 200, h: 15},
    {x: 100, y: canvas.height - 350, w: 150, h: 15},
];

// --- FİZİK MOTORU (AKICI HAREKET) ---
function update() {
    frameCount++;

    // 1. Dash Mantığı
    if (keys['ShiftLeft'] && player.canDash && !player.isDashing) {
        player.isDashing = true;
        player.canDash = false;
        player.dashTimer = CONFIG.dashDuration;
        player.vy = 0; // Dash sırasında yerçekimini kapa
    }

    if (player.isDashing) {
        player.vx = CONFIG.dashSpeed * player.facing;
        player.dashTimer--;
        if (player.dashTimer <= 0) {
            player.isDashing = false;
            player.vx = CONFIG.maxSpeed * player.facing * 0.5; // Dash bitişi yavaşla
        }
    } else {
        // 2. Yatay Hareket (Akıcı Hızlanma/Yavaşlama)
        if (keys['KeyD']) {
            player.vx += CONFIG.accel;
            player.facing = 1;
        } else if (keys['KeyA']) {
            player.vx -= CONFIG.accel;
            player.facing = -1;
        }

        player.vx *= CONFIG.friction; // Sürtünme uygula

        // Maksimum hız sınırı
        if (Math.abs(player.vx) > CONFIG.maxSpeed) {
            player.vx = CONFIG.maxSpeed * Math.sign(player.vx);
        }

        // 3. Zıplama Mantığı (Hassas Kontrol)
        if ((keys['KeyW'] || keys['Space']) && player.grounded) {
            player.vy = CONFIG.jumpForce;
            player.grounded = false;
        }
        
        // Hollow Knight Hissi: Tuşu bırakınca zıplamayı kes
        if (!(keys['KeyW'] || keys['Space']) && player.vy < CONFIG.minJumpForce) {
            player.vy = CONFIG.minJumpForce;
        }

        // Yerçekimi
        player.vy += CONFIG.gravity;
    }

    // Pozisyonu güncelle
    player.x += player.vx;
    player.y += player.vy;

    // 4. Çarpışma Kontrolü (Pürüzsüz)
    player.grounded = false;
    platforms.forEach(p => {
        // Yatay Çarpışma (Duvarlar)
        if (player.x < p.x + p.w && player.x + player.w > p.x &&
            player.y + player.h > p.y && player.y < p.y + p.h) {
            
            // Üstten çarpma (Yere inme)
            if (player.vy > 0 && player.y + player.h - player.vy <= p.y) {
                player.y = p.y - player.h;
                player.vy = 0;
                player.grounded = true;
                player.canDash = true; // Yere değince dash yenile
            } 
            // Alttan çarpma (Kafayı vurma)
            else if (player.vy < 0 && player.y - player.vy >= p.y + p.h) {
                player.y = p.y + p.h;
                player.vy = 0;
            }
        }
    });

    // Ekran sınırları
    if (player.x < 0) player.x = 0;
    if (player.x + player.w > canvas.width) player.x = canvas.width - player.w;
    if (player.y > canvas.height) { player.x = 100; player.y = 100; player.vy = 0; }
}

// --- ÇİZİM VE ATMOSFER ---
function draw() {
    // Arka plan (Gradient - Derinlik hissi)
    let grd = ctx.createLinearGradient(0, 0, 0, canvas.height);
    grd.addColorStop(0, "#0a0a12");
    grd.addColorStop(1, "#020205");
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Platformlar (Neon-Gothic)
    ctx.fillStyle = "#111";
    platforms.forEach(p => {
        ctx.fillRect(p.x, p.y, p.w, p.h);
        
        // Neon Çizgi
        ctx.strokeStyle = "#ff0055";
        ctx.lineWidth = 2;
        ctx.shadowBlur = 10;
        ctx.shadowColor = "#ff0055";
        ctx.strokeRect(p.x, p.y, p.w, p.h);
        ctx.shadowBlur = 0; // Reset blur
    });

    // Karakter (Pelerinli Silüet)
    ctx.save();
    ctx.translate(player.x + player.w/2, player.y + player.h/2);
    ctx.scale(player.facing, 1);
    
    // Pelerin (Hareketli)
    const capeAnim = Math.sin(frameCount * 0.15) * 3;
    ctx.fillStyle = player.isDashing ? "#fff" : "#ff0055";
    ctx.beginPath();
    ctx.moveTo(-10, -20);
    ctx.lineTo(10, -20);
    ctx.lineTo(15 + capeAnim, 20); // Pelerin ucu dalgalanıyor
    ctx.lineTo(-15 - capeAnim, 20);
    ctx.fill();

    // Kafa/Vücut Silüeti
    ctx.fillStyle = "#fff";
    ctx.fillRect(-8, -25, 16, 16); // Kafa
    ctx.fillRect(-5, -9, 10, 20); // Gövde

    ctx.restore();
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
