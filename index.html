<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Hollow Lexicon: Absolute Academy</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --neon: #00f2ff; --warn: #ff0055; --bg: #05070a; }
        body { margin: 0; background: var(--bg); overflow: hidden; font-family: 'Orbitron', sans-serif; }
        canvas { display: block; image-rendering: pixelated; }

        /* Modern HUD */
        #hud {
            position: absolute; top: 25px; left: 25px; pointer-events: none;
            background: rgba(10, 15, 25, 0.9); padding: 25px;
            border-left: 6px solid var(--neon); border-radius: 0 15px 15px 0;
            box-shadow: 0 0 30px rgba(0,0,0,0.5); border-right: 1px solid rgba(255,255,255,0.1);
        }
        .hp-container { color: var(--warn); font-size: 32px; filter: drop-shadow(0 0 8px var(--warn)); }
        .word-box { font-family: 'Cinzel'; font-size: 38px; color: white; text-shadow: 0 0 15px var(--neon); margin-bottom: 5px; }
        .area-tag { color: var(--neon); font-size: 11px; letter-spacing: 3px; font-weight: bold; opacity: 0.8; }
    </style>
</head>
<body>

<div id="hud">
    <div id="word-display" class="word-box">_ _ _ _ _</div>
    <div id="hp-display" class="hp-container">♥♥♥</div>
    <div id="area-display" class="area-tag">AREA: THE SCHOOL PLAYGROUND</div>
</div>

<canvas id="gameCanvas"></canvas>

<script>
/**
 * HOLLOW LEXICON - MASTER ENGINE
 * Her satırı senin görsellerine özel optimize edildi kanka.
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const GAME = {
    level: 0, hp: 3, frame: 0, active: true,
    words: ["I", "WANT", "TO", "LEARN", "ENGLISH"],
    areas: ["OKUL BAHÇESİ", "YERALTI TÜNELİ", "KÜTÜPHANE", "SPOR SALONU", "GRAND FINALE"],
    shake: 0
};

const keys = {};
window.onkeydown = e => keys[e.code] = true;
window.onkeyup = e => keys[e.code] = false;

// --- GÖRSELDEKİ KARAKTERİN ANALİZİNE GÖRE OLUŞTURULAN SINIF ---
class Player {
    constructor() {
        this.x = 200; this.y = 400;
        this.vx = 0; this.vy = 0;
        this.w = 50; this.h = 85;
        this.facing = 1;
        this.grounded = false;
        this.isAttacking = false;
        this.moveSpeed = 0.6; // Hız düşürüldü, daha kontrollü
        this.maxSpeed = 8;
        this.friction = 0.88; // Kayma engellendi
    }

    update() {
        // Hareket Mantığı
        if (keys['KeyD'] || keys['ArrowRight']) { this.vx += this.moveSpeed; this.facing = 1; }
        else if (keys['KeyA'] || keys['ArrowLeft']) { this.vx -= this.moveSpeed; this.facing = -1; }
        else { this.vx *= this.friction; }

        // Hız Sınırı
        if (Math.abs(this.vx) > this.maxSpeed) this.vx = this.maxSpeed * Math.sign(this.vx);

        // Zıplama
        if ((keys['Space'] || keys['KeyW']) && this.grounded) {
            this.vy = -18;
            this.grounded = false;
        }

        // Saldırı (Kitap Savurma)
        if (keys['KeyE'] && !this.isAttacking) {
            this.isAttacking = true;
            GAME.shake = 12;
            setTimeout(() => this.isAttacking = false, 300);
        }

        // Fizik
        this.vy += 0.8; // Yerçekimi
        this.x += this.vx; this.y += this.vy;

        // Platform Çarpışması
        this.grounded = false;
        const currentMap = levels[GAME.level].platforms;
        currentMap.forEach(p => {
            if (this.x < p.x + p.w && this.x + this.w > p.x && 
                this.y + this.h > p.y && this.y + this.h < p.y + 30 && this.vy >= 0) {
                this.y = p.y - this.h;
                this.vy = 0;
                this.grounded = true;
            }
        });

        if (this.y > canvas.height + 100) this.die();
    }

    die() {
        GAME.hp--; GAME.shake = 25;
        this.x = 200; this.y = 400; this.vx = 0;
        if (GAME.hp <= 0) { alert("FAILED THE CLASS!"); location.reload(); }
        updateHUD();
    }

    draw() {
        ctx.save();
        ctx.translate(this.x - cam.x + (this.facing === -1 ? this.w : 0), this.y - cam.y);
        ctx.scale(this.facing, 1);

        // Animasyon Değişkenleri
        let walkCycle = Math.sin(GAME.frame * 0.15) * 4;
        let idleCycle = Math.sin(GAME.frame * 0.05) * 2;

        // --- GÖRSELDEKİ SPRITE TASARIMI ---
        // Ayaklar (Bej)
        ctx.fillStyle = "#8d7a5d";
        ctx.fillRect(8, 65 + walkCycle, 12, 20);
        ctx.fillRect(28, 65 - walkCycle, 12, 20);

        // Gövde (Yeşil Ceket)
        ctx.fillStyle = "#2d4c2d";
        ctx.fillRect(5, 30 + idleCycle, 40, 40);
        
        // Kafa (Karakterinin saçı ve gözlüğü)
        ctx.fillStyle = "#ffe0b2"; // Ten
        ctx.fillRect(10, 0 + idleCycle, 30, 30);
        ctx.fillStyle = "#8d4a3e"; // Saç
        ctx.fillRect(8, -8 + idleCycle, 34, 15);
        ctx.fillRect(35, 5 + idleCycle, 8, 15);
        
        // Gözlükler
        ctx.strokeStyle = "#000"; ctx.lineWidth = 1.5;
        ctx.strokeRect(15, 10 + idleCycle, 8, 7);
        ctx.strokeRect(27, 10 + idleCycle, 8, 7);

        // KİTAP (English Book)
        ctx.fillStyle = this.isAttacking ? "#ff0055" : "#1b5e20";
        let attackExtra = this.isAttacking ? 15 * this.facing : 0;
        ctx.fillRect(32 + attackExtra, 35 + idleCycle, 20, 28);
        ctx.fillStyle = "#fff"; ctx.fillRect(48 + attackExtra, 35 + idleCycle, 4, 28);

        ctx.restore();
    }
}

// --- LEVEL DESIGN (GÖRSELDEKİ OKUL BAHÇESİ VE DİĞERLERİ) ---
const levels = [
    {   // Level 1: Bahçe (Playground)
        platforms: [
            {x: 0, y: 700, w: 1200, h: 400, c: "#4d7c0f"}, // Ana Zemin
            {x: 500, y: 550, w: 300, h: 30, c: "#b45309"}, // Kaydırak Üstü
            {x: 1300, y: 850, w: 1000, h: 300, c: "#1e293b"} // Yeraltı Tünel Girişi
        ],
        bg: "#bae6fd", goal: {x: 2100, y: 750}
    },
    {   // Level 2: Yeraltı (Underground)
        platforms: [
            {x: 0, y: 850, w: 2000, h: 200, c: "#0f172a"},
            {x: 400, y: 650, w: 200, h: 30, c: "#334155"},
            {x: 800, y: 450, w: 200, h: 30, c: "#334155"}
        ],
        bg: "#020617", goal: {x: 1800, y: 750}
    }
];

const player = new Player();
const cam = { x: 0, y: 0 };

function updateHUD() {
    document.getElementById('word-display').innerText = GAME.words.map((w, i) => i < GAME.level ? w : "_").join("  ");
    document.getElementById('hp-display').innerText = "♥".repeat(GAME.hp);
    document.getElementById('area-display').innerText = "AREA: " + GAME.areas[GAME.level];
}

function render() {
    GAME.frame++;
    if (GAME.shake > 0) GAME.shake *= 0.9;

    // Arka Plan Katmanları (Parallax)
    ctx.fillStyle = levels[GAME.level].bg;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Güneş ve Bulutlar (Görselindeki gibi)
    if (GAME.level === 0) {
        ctx.fillStyle = "#fde047";
        ctx.beginPath(); ctx.arc(canvas.width - 150, 100, 50, 0, Math.PI*2); ctx.fill();
    }

    ctx.save();
    // Ekran Sallanma Efekti
    if (GAME.shake > 1) ctx.translate((Math.random()-0.5)*GAME.shake, (Math.random()-0.5)*GAME.shake);

    // Kamera Takibi
    cam.x += (player.x - canvas.width/2.5 - cam.x) * 0.1;
    cam.y += (player.y - canvas.height/1.5 - cam.y) * 0.05;

    ctx.translate(-cam.x, -cam.y);

    // Platformları Çiz
    levels[GAME.level].platforms.forEach(p => {
        ctx.fillStyle = p.c;
        ctx.fillRect(p.x, p.y, p.w, p.h);
        // Üst Işık (Detay)
        ctx.fillStyle = "rgba(255,255,255,0.15)";
        ctx.fillRect(p.x, p.y, p.w, 8);
    });

    // Hedef (Goal)
    const goal = levels[GAME.level].goal;
    ctx.fillStyle = "#fff"; ctx.font = "bold 50px Cinzel";
    ctx.shadowBlur = 20; ctx.shadowColor = "#00f2ff";
    ctx.fillText(GAME.words[GAME.level], goal.x, goal.y - 50);
    ctx.shadowBlur = 0;

    if (Math.hypot(player.x - goal.x, player.y - goal.y) < 100) {
        GAME.level++;
        if (GAME.level >= GAME.words.length) { alert("MEZUNİYET!"); location.reload(); }
        player.x = 100; player.y = 400; updateHUD();
    }

    player.update();
    player.draw();

    ctx.restore();
    requestAnimationFrame(render);
}

updateHUD();
render();
</script>
</body>
</html>
