        .logo span { color: var(--blue); }

        .product-info { width: 50%; text-align: left; }

        .product-info p.price { font-size: 20px; font-weight: 600; color: var(--blue); margin-bottom: 25px; }
        .product-info p.desc { font-size: 15px; color: #666; margin-bottom: 40px; line-height: 1.6; max-width: 500px; }
