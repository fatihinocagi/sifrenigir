<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Hollow Lexicon: The Definitive Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --neon: #00f2ff; --gold: #ffd700; --warn: #ff0055; --bg: #02040a; }
        body { margin: 0; background: var(--bg); overflow: hidden; font-family: 'Orbitron', sans-serif; color: white; }
        canvas { display: block; image-rendering: pixelated; }

        /* UI SYSTEM */
        #ui-system { position: absolute; inset: 0; pointer-events: none; z-index: 1000; }
        .screen { position: absolute; inset: 0; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: auto; transition: 0.5s; }
        
        .main-title { font-family: 'Cinzel'; font-size: clamp(40px, 10vw, 90px); color: white; text-shadow: 0 0 30px var(--neon); margin: 0; }
        .sub-title { letter-spacing: 15px; color: #64748b; font-size: 14px; margin-bottom: 50px; }

        .btn {
            padding: 20px 80px; margin: 15px; border: 3px solid var(--neon); color: white;
            background: rgba(0, 242, 255, 0.05); cursor: pointer; font-size: 24px; font-family: 'Orbitron';
            transition: 0.3s; letter-spacing: 5px; clip-path: polygon(10% 0, 100% 0, 90% 100%, 0% 100%);
        }
        .btn:hover, .btn.active { background: var(--neon); color: black; box-shadow: 0 0 60px var(--neon); transform: scale(1.1); }

        #hud { position: absolute; top: 30px; left: 30px; display: none; pointer-events: none; }
        .status-panel { background: rgba(10, 20, 40, 0.85); padding: 30px; border-radius: 0 30px 30px 0; border-left: 10px solid var(--neon); border-right: 2px solid var(--neon); backdrop-filter: blur(15px); }
        .hp-heart { font-size: 35px; color: var(--warn); filter: drop-shadow(0 0 10px var(--warn)); }
        .word-slot { font-family: 'Cinzel'; font-size: 45px; text-shadow: 0 0 20px var(--neon); }
    </style>
</head>
<body>

<div id="ui-system">
    <div id="main-menu" class="screen">
        <h1 class="main-title">HOLLOW LEXICON</h1>
        <p class="sub-title">MASTER OF ACADEMY</p>
        <button class="btn" onclick="GameApp.init()">START JOURNEY</button>
        <button class="btn" onclick="GameApp.toggleSettings(true)">SETTINGS</button>
    </div>

    <div id="settings-menu" class="screen" style="display:none;">
        <h2 style="font-family:'Cinzel'; font-size: 45px; color: var(--neon);">ACADEMY CONFIG</h2>
        <div style="margin: 40px; text-align: center;">
            <p style="letter-spacing: 5px;">DIFFICULTY MODE</p>
            <button id="easy-btn" class="btn" onclick="GameApp.setDifficulty('easy')">EASY</button>
            <button id="hard-btn" class="btn" onclick="GameApp.setDifficulty('hardcore')">HARDCORE</button>
        </div>
        <button class="btn" style="border-color: var(--warn); color: var(--warn);" onclick="GameApp.toggleSettings(false)">SAVE & EXIT</button>
    </div>

    <div id="hud">
        <div class="status-panel">
            <div id="hud-word" class="word-slot">_ _ _ _ _</div>
            <div id="hud-hp" class="hp-heart">♥♥♥</div>
            <div id="hud-area" style="color: var(--neon); font-size: 14px; margin-top: 10px; font-weight: bold;">AREA: PLAYGROUND ENTRANCE</div>
        </div>
    </div>
</div>

<canvas id="gameCanvas"></canvas>

<script>
/**
 * HOLLOW LEXICON - GAME ENGINE CORE
 * Designed for High-Fidelity Character Sprites & Parallax Backgrounds
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// --- CONFIG & STATE ---
const CONFIG = {
    gravity: 0.8,
    friction: 0.85,
    difficulties: {
        easy: { hp: 5, enemySpeed: 2.5, jumpPower: -19 },
        hardcore: { hp: 1, enemySpeed: 6.5, jumpPower: -16 }
    }
};

const STATE = {
    difficulty: 'easy',
    level: 0,
    hp: 3,
    words: ["I", "WANT", "TO", "LEARN", "ENGLISH"],
    active: false,
    frame: 0,
    shake: 0
};

// --- ANIMATION SYSTEM ---
// Attığın sprite sheet'teki karakterin durumlarını simüle eden yapı
class SpriteAnimator {
    constructor() {
        this.states = {
            IDLE: { frames: 3, row: 0 },
            WALK: { frames: 4, row: 1 },
            ATTACK: { frames: 3, row: 2 }
        };
        this.currentState = 'IDLE';
        this.frameIdx = 0;
        this.tick = 0;
    }

    update(isMoving, isAttacking) {
        this.tick++;
        if (isAttacking) this.currentState = 'ATTACK';
        else if (isMoving) this.currentState = 'WALK';
        else this.currentState = 'IDLE';

        if (this.tick > 10) {
            this.frameIdx = (this.frameIdx + 1) % this.states[this.currentState].frames;
            this.tick = 0;
        }
    }
}

// --- PLAYER CLASS ---
class Player {
    constructor() {
        this.reset();
        this.w = 55; this.h = 85;
        this.animator = new SpriteAnimator();
        this.particles = [];
        this.projectiles = [];
    }

    reset() {
        this.x = 200; this.y = 500;
        this.vx = 0; this.vy = 0;
        this.facing = 1;
        this.grounded = false;
        this.attacking = false;
    }

    attack() {
        if (this.attacking) return;
        this.attacking = true;
        STATE.shake = 10;
        // Görseldeki gibi kitap fırlatma efekti
        this.projectiles.push({
            x: this.x + 20, y: this.y + 20,
            vx: 15 * this.facing, vy: 0,
            life: 40
        });
        setTimeout(() => this.attacking = false, 400);
    }

    update(platforms) {
        const diff = CONFIG.difficulties[STATE.difficulty];
        
        // Input Handling
        if (Input.keys['KeyD'] || Input.keys['ArrowRight']) { this.vx += 1.2; this.facing = 1; }
        else if (Input.keys['KeyA'] || Input.keys['ArrowLeft']) { this.vx -= 1.2; this.facing = -1; }
        else { this.vx *= CONFIG.friction; }

        if ((Input.keys['Space'] || Input.keys['KeyW']) && this.grounded) {
            this.vy = diff.jumpPower;
            this.grounded = false;
        }

        if (Input.keys['KeyE']) this.attack();

        // Physics
        this.vy += CONFIG.gravity;
        this.x += this.vx;
        this.y += this.vy;

        // Platform Collision
        this.grounded = false;
        platforms.forEach(p => {
            if (this.x < p.x + p.w && this.x + this.w > p.x && 
                this.y + this.h > p.y && this.y + this.h < p.y + 30 && this.vy >= 0) {
                this.y = p.y - this.h;
                this.vy = 0;
                this.grounded = true;
            }
        });

        // Animation State
        this.animator.update(Math.abs(this.vx) > 0.5, this.attacking);

        // Projectile Update
        this.projectiles.forEach((p, i) => {
            p.x += p.vx; p.life--;
            if (p.life <= 0) this.projectiles.splice(i, 1);
        });

        if (this.y > canvas.height + 200) GameApp.damage();
    }

    draw(cx, cy) {
        // Projectiles
        ctx.fillStyle = "#00f2ff";
        this.projectiles.forEach(p => {
            ctx.shadowBlur = 15; ctx.shadowColor = "#00f2ff";
            ctx.fillRect(p.x - cx, p.y - cy, 20, 15);
            ctx.shadowBlur = 0;
        });

        ctx.save();
        ctx.translate(this.x - cx + (this.facing === -1 ? this.w : 0), this.y - cy);
        ctx.scale(this.facing, 1);

        // --- DİNAMİK SPRITE ÇİZİMİ (GÖRSELDEKİ KARAKTERİN AYNISI) ---
        // Saç (Turuncu-Kahve)
        ctx.fillStyle = "#8d4a3e";
        ctx.fillRect(10, -10, 35, 20);
        // Yüz & Gözlük
        ctx.fillStyle = "#ffe0b2";
        ctx.fillRect(12, 10, 30, 25);
        ctx.strokeStyle = "#000"; ctx.lineWidth = 2;
        ctx.strokeRect(18, 18, 8, 8); ctx.strokeRect(30, 18, 8, 8);
        // Ceket (Yeşil Kareli)
        ctx.fillStyle = "#2d4c2d";
        ctx.fillRect(5, 35, 45, 40);
        // Elindeki Kitap (Görseldeki "English" kitabı)
        ctx.fillStyle = "#1b5e20";
        let bookAnim = Math.sin(STATE.frame * 0.1) * 3;
        ctx.fillRect(35, 45 + bookAnim, 25, 30);
        ctx.fillStyle = "#fff"; ctx.fillRect(55, 45 + bookAnim, 5, 30);

        ctx.restore();
    }
}

// --- LEVEL & PARALLAX MANAGER ---
class LevelManager {
    constructor() {
        this.platforms = [
            // Playground (Bahçe Katmanı)
            { x: 0, y: 750, w: 2500, h: 300, type: 'grass', color: '#3d5a2d' },
            { x: 800, y: 580, w: 400, h: 40, type: 'slide', color: '#b45309' },
            // Underground (Yeraltı Tüneli Katmanı)
            { x: 400, y: 950, w: 1200, h: 200, type: 'tunnel', color: '#1a1c2c' },
            { x: 1800, y: 600, w: 600, h: 500, type: 'school', color: '#4a5568' }
        ];
        this.enemies = [
            { x: 1000, y: 710, range: 400, startX: 1000, s: 2 }
        ];
    }

    drawBackground(cx) {
        // Sky (Görseldeki Gökyüzü)
        let g = ctx.createLinearGradient(0,0,0, canvas.height);
        g.addColorStop(0, '#87ceeb'); g.addColorStop(1, '#e0f7fa');
        ctx.fillStyle = g;
        ctx.fillRect(0,0,canvas.width, canvas.height);

        // Sun (Görseldeki Güneş)
        ctx.fillStyle = "#ffdb58";
        ctx.beginPath(); ctx.arc(canvas.width - 150, 120, 60, 0, Math.PI*2); ctx.fill();

        // Parallax School Building (Uzak Binalar)
        ctx.fillStyle = "rgba(74, 85, 104, 0.3)";
        ctx.fillRect(500 - cx * 0.3, 200, 800, 600);
    }
}

// --- GAME APPLICATION (MODULE) ---
const GameApp = {
    player: new Player(),
    level: new LevelManager(),
    cam: { x: 0, y: 0 },

    init() {
        document.getElementById('main-menu').style.opacity = '0';
        setTimeout(() => {
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('hud').style.display = 'block';
            STATE.active = true;
            this.loop();
        }, 500);
    },

    damage() {
        STATE.hp--; STATE.shake = 30;
        if (STATE.hp <= 0) { alert("DERS TEKRARI!"); location.reload(); }
        this.player.reset();
        this.updateHUD();
    },

    updateHUD() {
        document.getElementById('hud-word').innerText = STATE.words.map((w, i) => i < STATE.level ? w : "_").join("  ");
        document.getElementById('hud-hp').innerText = "♥".repeat(STATE.hp);
    },

    toggleSettings(show) {
        document.getElementById('settings-menu').style.display = show ? 'flex' : 'none';
    },

    setDifficulty(mode) {
        STATE.difficulty = mode;
        STATE.hp = CONFIG.difficulties[mode].hp;
        document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
        document.getElementById(mode + '-btn').classList.add('active');
        this.updateHUD();
    },

    loop() {
        if (!STATE.active) return;
        STATE.frame++;
        if (STATE.shake > 0) STATE.shake *= 0.9;

        // Update
        this.player.update(this.level.platforms);
        
        // Enemy Logic
        this.level.enemies.forEach(e => {
            e.x += e.s;
            if (Math.abs(e.x - e.startX) > e.range) e.s *= -1;
            if (Math.hypot(this.player.x - e.x, this.player.y - e.y) < 60) this.damage();
        });

        // Goal Logic
        if (this.player.x > 2200) {
            STATE.level++;
            if (STATE.level >= STATE.words.length) { alert("MEZUN OLDUN!"); location.reload(); }
            this.player.reset();
            this.updateHUD();
        }

        // Camera Smooth Follow
        this.cam.x += (this.player.x - canvas.width/2.5 - this.cam.x) * 0.1;

        // Render
        this.render();
        requestAnimationFrame(() => this.loop());
    },

    render() {
        ctx.save();
        if (STATE.shake > 1) ctx.translate((Math.random()-0.5)*STATE.shake, (Math.random()-0.5)*STATE.shake);
        
        this.level.drawBackground(this.cam.x);

        ctx.translate(-this.cam.x, 0);

        // Platforms
        this.level.platforms.forEach(p => {
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x, p.y, p.w, p.h);
            // Neon Edge
            ctx.fillStyle = "rgba(255,255,255,0.2)";
            ctx.fillRect(p.x, p.y, p.w, 8);
        });

        // Enemies (F Notları)
        this.level.enemies.forEach(e => {
            ctx.fillStyle = "#ff0055";
            ctx.font = "bold 50px Cinzel";
            ctx.fillText("F", e.x, e.y + 40);
        });

        this.player.draw(0, 0);
        ctx.restore();
    }
};

const Input = {
    keys: {},
    init() {
        window.onkeydown = (e) => this.keys[e.code] = true;
        window.onkeyup = (e) => this.keys[e.code] = false;
    }
};

Input.init();
</script>
</body>
</html>
